// ೫. ಡ್ರಾಪ್‌ಡೌನ್‌ನಲ್ಲಿ ಬಳಕೆದಾರರಿಗೆ ಅನುಮತಿಸಿದ ವಿಷಯಗಳು & ಸ್ಪರ್ಧಾತ್ಮಕ ಪರೀಕ್ಷೆಗಳ ನಿಖರ ಫಿಲ್ಟರ್
window.updateSubjectOptionsForClass = function() {
  var classSelect = document.getElementById('cfg-class');
  var subjSelect = document.getElementById('cfg-subject');
  if (!classSelect || !subjSelect) return;

  var session = JSON.parse(localStorage.getItem('wy_active_session') || 'null');
  var isAdmin = sessionStorage.getItem('wy_is_admin') === 'true';
  var isFullAccess = isAdmin || (session && session.type === 'school') || (session && session.allowedSubjects && session.allowedSubjects.includes('all'));

  var activeGrade = parseInt(classSelect.value) || 8;
  var availableSubjects = [];

  if (activeGrade >= 1 && activeGrade <= 5) {
    availableSubjects = [
      { val: "ಕನ್ನಡ (Kannada)", key: "kannada" },
      { val: "English", key: "english" },
      { val: "ಗಣಿತ (Mathematics)", key: "mathematics" },
      { val: "ಪರಿಸರ ಅಧ್ಯಯನ (EVS)", key: "evs" }
    ];
  } else if (activeGrade === 6) {
    availableSubjects = [
      { val: "ವಿಜ್ಞಾನ (Science)", key: "science" },
      { val: "ಕನ್ನಡ (Kannada)", key: "kannada" },
      { val: "ಸಮಾಜ ವಿಜ್ಞಾನ (Social Science)", key: "social_science" },
      { val: "ಗಣಿತ (Mathematics)", key: "mathematics" },
      { val: "English", key: "english" },
      { val: "ಹಿಂದಿ (Hindi)", key: "hindi" },
      { val: "ಮೊರಾರ್ಜಿ ಪ್ರವೇಶ ಪರೀಕ್ಷೆ (Morarji Entrance)", key: "morarji_entrance", isComp: true },
      { val: "ಆದರ್ಶ ವಿದ್ಯಾಲಯ ಪ್ರವೇಶ (Adarsha Entrance)", key: "adarsha_entrance", isComp: true }
    ];
  } else if (activeGrade === 8) {
    availableSubjects = [
      { val: "ವಿಜ್ಞಾನ (Science)", key: "science" },
      { val: "ಕನ್ನಡ (Kannada)", key: "kannada" },
      { val: "ಸಮಾಜ ವಿಜ್ಞಾನ (Social Science)", key: "social_science" },
      { val: "ಗಣಿತ (Mathematics)", key: "mathematics" },
      { val: "English", key: "english" },
      { val: "ಹಿಂದಿ (Hindi)", key: "hindi" },
      { val: "NMMS GMAT (ಪತ್ರಿಕೆ 1 - ಬೌದ್ಧಿಕ ಸಾಮರ್ಥ್ಯ)", key: "nmms_gmat", isComp: true },
      { val: "NMMS SAT (ಪತ್ರಿಕೆ 2 - ಶೈಕ್ಷಣಿಕ ಸಾಮರ್ಥ್ಯ)", key: "nmms_sat", isComp: true }
    ];
  } else {
    availableSubjects = [
      { val: "ವಿಜ್ಞಾನ (Science)", key: "science" },
      { val: "ಕನ್ನಡ (Kannada)", key: "kannada" },
      { val: "ಸಮಾಜ ವಿಜ್ಞಾನ (Social Science)", key: "social_science" },
      { val: "ಗಣಿತ (Mathematics)", key: "mathematics" },
      { val: "English", key: "english" },
      { val: "ಹಿಂದಿ (Hindi)", key: "hindi" }
    ];
  }

  var allowedSubjsList = [];
  if (session && session.allowedSubjects) {
    var rawArr = Array.isArray(session.allowedSubjects) ? session.allowedSubjects : String(session.allowedSubjects).split(',');
    allowedSubjsList = rawArr.map(s => window.normalizeSubjectMatchText(s.trim())).filter(Boolean);
  }

  var filteredSubjects = availableSubjects;
  if (!isFullAccess && allowedSubjsList.length > 0 && !allowedSubjsList.includes('all')) {
    filteredSubjects = availableSubjects.filter(function(subj) {
      return allowedSubjsList.includes(subj.key);
    });
  }

  if (filteredSubjects.length === 0) {
    subjSelect.innerHTML = `<option value="">🔒 ವಿಷಯ ಲಭ್ಯವಿಲ್ಲ (Not Subscribed)</option>`;
    return;
  }

  var curSelectedSubj = subjSelect.value;
  subjSelect.innerHTML = filteredSubjects.map(function(s) {
    var badgeClass = s.isComp ? 'font-black text-amber-900 bg-amber-50' : 'font-bold';
    return `<option value="${s.val}" class="${badgeClass}">${s.isComp ? '🌟 ' : ''}${s.val}</option>`;
  }).join('');

  if (filteredSubjects.some(s => s.val === curSelectedSubj)) {
    subjSelect.value = curSelectedSubj;
  } else {
    subjSelect.value = filteredSubjects[0].val;
  }
};

// ೬. ಡ್ಯಾಶ್‌ಬೋರ್ಡ್‌ನಲ್ಲಿ "ಸ್ಪರ್ಧಾತ್ಮಕ ಪರೀಕ್ಷೆಗಳ ನೋಂದಣಿ (₹100)" ಬಟನ್ ಅಳವಡಿಕೆ
var prevRenderDashboardWithCompBtn = window.renderUltraModernDashboard;
window.renderUltraModernDashboard = function() {
  if (typeof prevRenderDashboardWithCompBtn === 'function') {

// ೧. ಪ್ರಶ್ನೆಯ ಯೂನಿಕ್ ಕೀ ಪಡೆಯುವ ಫಂಕ್ಷನ್
function getQuestionUniqueKey(q) {
  if (!q) return '';
  if (q.id) return String(q.id);
  // id ಇಲ್ಲದಿದ್ದರೆ ಪ್ರಶ್ನೆಯ ಪಠ್ಯದ ಆಧಾರದ ಮೇಲೆ ಕೀ ಗುರುತಿಸುವುದು
  return String(q.q || '').trim().replace(/\s+/g, '_').substring(0, 45);
}

// ೨. ಬಳಸಿದ ಪ್ರಶ್ನೆಗಳ ಕೀ ಪಡೆಯುವುದು (ವಿಷಯ & ತರಗತಿವಾರು ಪ್ರತ್ಯೇಕ ಮೆಮೊರಿ)
function getUsedQuestionsStorageKey() {
  var grade = document.getElementById('cfg-class')?.value || '8';
  var rawSubj = document.getElementById('cfg-subject')?.value || 'general';
  var cleanSubj = (typeof getNormalizedSubjectKey === 'function') ? getNormalizedSubjectKey(rawSubj) : 'general';
  return 'wy_used_q_ids_' + grade + '_' + cleanSubj;
}

// ೩. ಬಳಸಿದ ಪ್ರಶ್ನೆಗಳ ಪಟ್ಟಿ ಲೋಡ್ ಮಾಡುವುದು
function getUsedQuestionIdsList() {
  try {
    var raw = sessionStorage.getItem(getUsedQuestionsStorageKey());
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

// ೪. ಬಳಸಿದ ಪ್ರಶ್ನೆಗಳನ್ನು ಮೆಮೊರಿಗೆ ಸೇವ್ ಮಾಡುವುದು
function recordQuestionsAsUsed(questionsList) {
  if (!questionsList || questionsList.length === 0) return;
  var usedIds = getUsedQuestionIdsList();
  questionsList.forEach(function(q) {
    var key = getQuestionUniqueKey(q);
    if (key && !usedIds.includes(key)) {
      usedIds.push(key);
    }
  });
  sessionStorage.setItem(getUsedQuestionsStorageKey(), JSON.stringify(usedIds));
  updateRepeatBadgeUI();
}

// ೫. ಹಿಸ್ಟರಿ ರೀಸೆಟ್ ಮಾಡುವ ಫಂಕ್ಷನ್ (ಮರಳಿ Set-1 ರಿಂದ ಶುರು ಮಾಡಲು)

var originalStrictGeneratePackage = window.generateExamPackageFromBank;
window.generateExamPackageFromBank = function() {
  var selectedClass = document.getElementById('cfg-class')?.value || '8';
  var currentSubj = document.getElementById('cfg-subject')?.value || '';

  var targetTotalMarks = parseInt(document.getElementById('cfg-total-marks')?.value) || 40;
  var targetTotalQuestions = parseInt(document.getElementById('cfg-total-questions')?.value) || 24;
  var examDate = document.getElementById('cfg-exam-date')?.value || '2026-27';

  var checkedTypeNodes = document.querySelectorAll('input[name="qtype_opt"]:checked');
  var selectedTypes = Array.from(checkedTypeNodes).map(function(cb) { return cb.value; });
  if (selectedTypes.length === 0) return alert('⚠️ ದಯವಿಟ್ಟು Step 3 ರಲ್ಲಿ ಕನಿಷ್ಠ ಒಂದು ಪ್ರಶ್ನೆ ಪ್ರಕಾರವನ್ನು ಆಯ್ಕೆಮಾಡಿ.');

  var selectedBoxes = document.querySelectorAll('input[name="selected_chapter"]:checked');
  var selectedChapters = Array.from(selectedBoxes).map(function(b) { return b.value; });
  appState.activeSelectedChapters = selectedChapters;

  // 🌟 ಪೂರ್ಣ ಪ್ರಶ್ನೆಗಳ ಪೂಲ್
  var allMatchingPool = (appState.activeSubjectQuestions || []).filter(function(q) {
    if (!q) return false;
    var isChapOk = (typeof isChapterMatchedFlexibly === 'function') 
      ? isChapterMatchedFlexibly(q.chapter, selectedChapters) 
      : (selectedChapters.length === 0 || selectedChapters.some(function(sc) { return safeCleanMatch(sc) === safeCleanMatch(q.chapter); }));
    var cType = getCanonicalQuestionType(q);
    return isChapOk && selectedTypes.includes(cType);
  });

  if (allMatchingPool.length === 0) {
    return alert('⚠️ ಆಯ್ಕೆಮಾಡಿದ ಪಾಠಗಳಲ್ಲಿ ಪ್ರಶ್ನೆಗಳು ಲಭ್ಯವಿಲ್ಲ. Step 2 ಮತ್ತು Step 3 ಪರಿಶೀಲಿಸಿ.');

  // 🌟 ಹಂತ ೧: ಈಗಾಗಲೇ ಬಳಕೆಯಾದ ಪ್ರಶ್ನೆಗಳನ್ನು ಪ್ರತ್ಯೇಕಿಸಿ ಕೇವಲ "ಹೊಸ ಪ್ರಶ್ನೆಗಳ ಪೂಲ್" ರಚಿಸುವುದು
  var usedIds = getUsedQuestionIdsList();
  var freshUnusedPool = allMatchingPool.filter(function(q) {
    return !usedIds.includes(getQuestionUniqueKey(q));
  });

  var chosen = [];
  var isFreshSetUsed = false;

  // ಮೊದಲು ಕೇವಲ ಹೊಸ ಪ್ರಶ್ನೆಗಳಿಂದಲೇ ಪತ್ರಿಕೆ ರಚಿಸಲು ಪ್ರಯತ್ನಿಸುವುದು
  if (freshUnusedPool.length >= targetTotalQuestions) {
    chosen = solveStrictExactExamMath(freshUnusedPool, targetTotalMarks, targetTotalQuestions, selectedTypes);
    if (chosen && chosen.length === targetTotalQuestions) {
      isFreshSetUsed = true;
    }
  }

  // ಹೊಸ ಪ್ರಶ್ನೆಗಳು ಸಾಲದಿದ್ದಾಗ (ಬ್ಯಾಂಕ್ ಮುಗಿದಾಗ):
  if (!chosen || chosen.length === 0) {
    if (usedIds.length > 0) {
      showToast("📢 ಬ್ಯಾಂಕ್‌ನ ಎಲ್ಲಾ ಪ್ರಶ್ನೆಗಳು ಬಳಕೆಯಾಗಿವೆ! ಸೈಕಲ್ ಅನ್ನು ಮರುಹೊಂದಿಸಿ ಪುನಃ ಹೊಸದಾಗಿ ಆರಂಭಿಸಲಾಗುತ್ತಿದೆ...", "info");
      resetQuestionRepeatCycle(false);
    }
    // ಪೂರ್ಣ ಪೂಲ್‌ನಿಂದ ಆಯ್ಕೆ ಮಾಡುವುದು
    chosen = solveStrictExactExamMath(allMatchingPool, targetTotalMarks, targetTotalQuestions, selectedTypes);
  }

  if (!chosen || chosen.length === 0) {
    return alert('⚠️ ಆಯ್ಕೆಮಾಡಿದ ಅಂಕ ಮತ್ತು ಪ್ರಶ್ನೆಗಳ ಸಂಯೋಜನೆ ಸಾಧ್ಯವಾಗುತ್ತಿಲ್ಲ. ದಯವಿಟ್ಟು ಹೆಚ್ಚಿನ ಪಾಠಗಳನ್ನು ಅಥವಾ ಪ್ರಕಾರಗಳನ್ನು ಆಯ್ಕೆಮಾಡಿ.');
  }

  // 🌟 ಆಯ್ಕೆಯಾದ ಪ್ರಶ್ನೆಗಳನ್ನು ಮೆಮೊರಿಗೆ ಸೇವ್ ಮಾಡುವುದು (ಮುಂದಿನ ಬಾರಿ ರಿಪೀಟ್ ಆಗದಂತೆ)
  recordQuestionsAsUsed(chosen);

  appState.activeGeneratedQuestions = chosen;
  var actualMarks = chosen.reduce(function(a, b) { return a + getExactQuestionMarks(b); }, 0);
  var headerHtml = generateOfficialBoardHeader(schoolName, currentSubj, selectedClass, rawExamType, actualMarks, examDate);

  renderFullExamPaperWithCustomHeader(headerHtml);

  var outSec = document.getElementById('output-section');
  if (outSec) {
    outSec.classList.remove('hidden');
    switchOutputTab('paper');
    outSec.scrollIntoView({ behavior: 'smooth' });
  }

  if (isFreshSetUsed) {
    showToast(`⚡ ಯಶಸ್ವಿ: 100% ಸಂಪೂರ್ಣ ಹೊಸ ಪ್ರಶ್ನೆಗಳ ಪತ್ರಿಕೆ ಸಿದ್ಧವಾಗಿದೆ! (${chosen.length} ಪ್ರಶ್ನೆಗಳು)`, 'success');
  } else {
    showToast(`⚡ ಯಶಸ್ವಿ: ${chosen.length} ಪ್ರಶ್ನೆಗಳು & ${actualMarks} ಅಂಕಗಳ ಪತ್ರಿಕೆ ಸಿದ್ಧವಾಗಿದೆ!`, 'success');

// =========================================================================
// 🔀 1-CLICK MULTI-SET GENERATOR ENGINE (SET A, SET B, SET C, SET D)
// =========================================================================

// ಜಾಗತಿಕ ಸೆಟ್ ಸ್ಥಿತಿ
appState.currentExamSet = 'A';
appState.baseGeneratedQuestions = [];

// ೧. ಸೆಟ್‌ವಾರು ಪ್ರಶ್ನೆಗಳನ್ನು ಕ್ರಮಬದ್ಧವಾಗಿ ಜಂಬಲ್ ಮಾಡುವ ಫಂಕ್ಷನ್
function generateJumbledSetQuestions(baseList, setCode) {
  if (!baseList || baseList.length === 0) return [];
  if (setCode === 'A') return JSON.parse(JSON.stringify(baseList));

  // ಪ್ರಶ್ನೆಗಳನ್ನು ಅವುಗಳ ಪ್ರಕಾರವಾರು ಗುಂಪು ಮಾಡುವುದು
  var typeMap = new Map();
  baseList.forEach(function(q) {
    var t = (typeof getCanonicalQuestionType === 'function') ? getCanonicalQuestionType(q) : 'vsa_1m';
    if (!typeMap.has(t)) typeMap.set(t, []);
    typeMap.get(t).push(JSON.parse(JSON.stringify(q)));
  });

  var result = [];

  // ಸೆಟ್‌ಗೆ ತಕ್ಕಂತೆ ಪ್ರತಿಯೊಂದು ವಿಭಾಗದೊಳಗಿನ ಪ್ರಶ್ನೆಗಳನ್ನು ಜಂಬಲ್ ಮಾಡುವುದು
  typeMap.forEach(function(qGroup, tKey) {
    if (tKey === 'match') {
      // ಹೊಂದಿಸಿ ಬರೆಯಿರಿ ಪ್ರಶ್ನೆ ಒಂದೇ ಇರುವುದರಿಂದ ಹಾಗೆಯೇ ಉಳಿಸುವುದು
      result.push(...qGroup);
      return;
    }

    var list = [...qGroup];
    var len = list.length;

    if (len > 1) {
      if (setCode === 'B') {
        // Set B: ಅರ್ಧದಿಂದ ರೊಟೇಟ್ ಮಾಡುವುದು
        var mid = Math.floor(len / 2);
        list = list.slice(mid).concat(list.slice(0, mid));
      } else if (setCode === 'C') {
        // Set C: ರಿವರ್ಸ್ ಮಾಡುವುದು
        list = list.reverse();
      } else if (setCode === 'D') {
        // Set D: ಬೆಸ ಮತ್ತು ಸಮ ಸ್ಥಾನಗಳ ಜಂಬಲ್
        var evens = list.filter((_, i) => i % 2 === 0);
        var odds = list.filter((_, i) => i % 2 !== 0);
        list = odds.concat(evens);
      }
    }

    result.push(...list);
  });

  return result;
}

// ೨. ಹೆಡರ್‌ನಲ್ಲಿ SET ಕೋಡ್ ಪ್ರದರ್ಶಿಸುವ ಇಂಜೆಕ್ಷನ್

// ೩. ಸೆಟ್ ಬದಲಾವಣೆ ಮಾಡುವ ಕಂಟ್ರೋಲರ್ (Switch Set)
window.switchExamSet = function(targetSet) {
  if (!appState.baseGeneratedQuestions || appState.baseGeneratedQuestions.length === 0) {

  appState.currentExamSet = targetSet;

  // ಜಂಬಲ್ಡ್ ಪ್ರಶ್ನೆಗಳನ್ನು ಸಕ್ರಿಯಗೊಳಿಸುವುದು
  appState.activeGeneratedQuestions = generateJumbledSetQuestions(appState.baseGeneratedQuestions, targetSet);

      }
    }
  });

  // ಪತ್ರಿಕೆ, ಕೀ ಉತ್ತರ ಮತ್ತು OMR ಅನ್ನು ತಕ್ಷಣ ರಿಫ್ರೆಶ್ ಮಾಡುವುದು
  var schoolName = document.getElementById('cfg-school-name')?.value.trim() || 'ಸರ್ಕಾರಿ ಶಾಲೆ';
  var grade = document.getElementById('cfg-class')?.value || '8';
  var rawSubj = document.getElementById('cfg-subject')?.value || 'ವಿಷಯ';
  var rawExamType = document.getElementById('cfg-exam-type')?.value || 'ಪರೀಕ್ಷೆ';
  var examDate = document.getElementById('cfg-exam-date')?.value || '2026-27';
  var actualMarks = appState.activeGeneratedQuestions.reduce((a, b) => a + getExactQuestionMarks(b), 0);

  var headerHtml = generateOfficialBoardHeader(schoolName, rawSubj, grade, rawExamType, actualMarks, examDate);
  renderFullExamPaperWithCustomHeader(headerHtml);

  showToast(`⚡ ಯಶಸ್ವಿ: ಪತ್ರಿಕೆ ಮತ್ತು ಕೀ ಉತ್ತರಗಳನ್ನು "SET - ${targetSet}" ಗೆ ಹೊಂದಿಸಲಾಗಿದೆ!`, 'success');
};

// ೪. ಜನರೇಟ್ ಆದಾಗ Set A, B, C, D ಬಟನ್ ಬಾರ್ ಅನ್ನು UI ನಲ್ಲಿ ಮೂಡಿಸುವುದು

var omrScannerState = {
  stream: null,

// ೧. ಬೀಪ್ ಸೌಂಡ್ (ಸ್ಕ್ಯಾನರ್ ಆಡಿಯೋ ಎಫೆಕ್ಟ್)
function playScannerAudioBeep(isSuccess) {
  try {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    var ctx = new AudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(isSuccess ? 880 : 320, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + (isSuccess ? 0.16 : 0.35));
  } catch(e) {}
}

// ೨. ಪ್ರಸ್ತುತ ಪತ್ರಿಕೆಯ ಸರಿಯಾದ ಕೀ ಉತ್ತರಗಳ ಪಟ್ಟಿ ಪಡೆಯುವುದು
function buildCurrentCorrectAnswersList() {
  var list = appState.activeGeneratedQuestions || [];
  var keyMap = {};
  list.forEach(function(q, idx) {
    var rawAns = String(q.ans || '').trim().toUpperCase();
    var letter = 'A';
    var m = rawAns.match(/\(([A-D])\)/);
    if (m) letter = m[1];
    else {
      var m2 = rawAns.match(/\b([A-D])\b/);
      if (m2) letter = m2[1];
      else if (rawAns.includes('ಅ')) letter = 'A';
      else if (rawAns.includes('ಆ')) letter = 'B';
      else if (rawAns.includes('ಇ')) letter = 'C';
      else if (rawAns.includes('ಈ')) letter = 'D';
    }
    keyMap[idx + 1] = letter;
  });
  return keyMap;
}

function startLiveCameraStream() {
  var video = document.getElementById('omr-video-feed');
  if (!video) return;

  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    }).then(function(stream) {
      omrScannerState.stream = stream;
      omrScannerState.activeVideo = video;
      video.srcObject = stream;
      video.play();
    }).catch(function(err) {
      console.warn("Camera stream notice:", err);
      var targetBox = document.getElementById('omr-target-box');
      if (targetBox) {
        targetBox.innerHTML = `
          <div class="p-4 text-center text-amber-200 text-xs font-bold">

          </div>
        `;
      }

}

// ೬. ಲೈವ್ ವೀಡಿಯೋ ಕ್ಯಾಪ್ಚರ್
window.captureLiveVideoFrame = function() {
  var video = document.getElementById('omr-video-feed');
  var canvas = document.getElementById('omr-proc-canvas');
  if (!video || !canvas) return;

  var w = video.videoWidth || 640;
  var h = video.videoHeight || 480;
  canvas.width = w;
  canvas.height = h;

  var ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);

  processOMRCanvasImage(canvas);
};

// ೭. ಫೋಟೋ ಅಪ್‌ಲೋಡ್
window.handleOMRPhotoUpload = function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;

  var reader = new FileReader();
  reader.onload = function(evt) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.getElementById('omr-proc-canvas');
      if (!canvas) return;
      canvas.width = img.width;
      canvas.height = img.height;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      processOMRCanvasImage(canvas);
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
};

// ೮. ಕಟ್ಟುನಿಟ್ಟಾದ ನೈಜ OMR ಮೌಲ್ಯಮಾಪನ ಅಲ್ಗಾರಿದಮ್ (STRICT VALIDATION)
function processOMRCanvasImage(canvas) {
  var keyMap = omrScannerState.correctAnswersMap || {};
  var totalQ = Object.keys(keyMap).length || 40;
  var ctx = canvas.getContext('2d');
  var w = canvas.width;
  var h = canvas.height;

  if (w === 0 || h === 0) return;

  var imgData = ctx.getImageData(0, 0, w, h);
  var pixels = imgData.data;

  // 🌟 OMR ಕಾಗದ ಹೌದೇ ಅಲ್ಲವೇ ಎಂದು ಪರೀಕ್ಷಿಸುವುದು (ಕಾಲಿನ ಚಿತ್ರ, ನೆಲ, ಕತ್ತಲೆ ತಡೆಗಟ್ಟಲು)
  var whitePixelCount = 0;
  var darkPixelCount = 0;
  var sampleStep = 8;
  var totalSamples = 0;

  for (var i = 0; i < pixels.length; i += 4 * sampleStep) {
    var r = pixels[i];
    var g = pixels[i + 1];
    var b = pixels[i + 2];
    var brightness = (r * 0.299 + g * 0.587 + b * 0.114);

    if (brightness > 160) whitePixelCount++;
    else if (brightness < 75) darkPixelCount++;
    totalSamples++;
  }

  var whiteRatio = whitePixelCount / totalSamples;
  var darkRatio = darkPixelCount / totalSamples;

  // ಕಾಗದವು ಬಿಳಿ ಹಿನ್ನೆಲೆ ಮತ್ತು ಕಪ್ಪು ವೃತ್ತ/ಅಕ್ಷರ ಹೊಂದಿಲ್ಲದಿದ್ದರೆ ತಕ್ಷಣ ತಿರಸ್ಕರಿಸುವುದು
  var isRealOMRSheet = (whiteRatio >= 0.38 && darkRatio >= 0.025 && darkRatio <= 0.45);

  if (!isRealOMRSheet) {
    playScannerAudioBeep(false); // ಎರರ್ ಬೀಪ್

    document.getElementById('omr-res-score').innerText = '0';
    document.getElementById('omr-res-grade').innerText = '❌ OMR ಹಾಳೆ ಕಂಡುಬಂದಿಲ್ಲ';
    document.getElementById('omr-cnt-correct').innerText = '0';
    document.getElementById('omr-cnt-wrong').innerText = '0';
    document.getElementById('omr-cnt-blank').innerText = totalQ;

    var badge = document.getElementById('omr-scan-badge');
    if (badge) {
      badge.className = 'text-[10px] bg-rose-100 text-rose-800 font-black px-2 py-0.5 rounded-full';
      badge.innerText = '❌ ಸ್ಕ್ಯಾನ್ ವಿಫಲವಾಗಿದೆ';
    }

    var saveBtn = document.getElementById('btn-save-omr-record');
    if (saveBtn) saveBtn.disabled = true;

    alert(
      "⚠️ OMR ಹಾಳೆ ಪತ್ತೆಯಾಗಿಲ್ಲ!\n\n" +
      "ನೀವು ಹಿಡಿದಿರುವ ಚಿತ್ರದಲ್ಲಿ ಅಧಿಕೃತ OMR ಹಾಳೆಯ ಕಾಗದ ಕಂಡುಬಂದಿಲ್ಲ.\n\n" +
      "ದಯವಿಟ್ಟು ಮುದ್ರಿತ OMR ಹಾಳೆಯನ್ನು ಬೆಳಕಿನಲ್ಲಿ ನೇರವಾಗಿ ಹಿಡಿದು ಸ್ಕ್ಯಾನ್ ಮಾಡಿ."
    );
    return;
  }

  // 🌟 OMR ವೃತ್ತಗಳ ನೈಜ ಶೇಡಿಂಗ್ ವಿಶ್ಲೇಷಣೆ
  var gridStartX = Math.floor(w * 0.08);
  var gridEndX = Math.floor(w * 0.92);
  var gridStartY = Math.floor(h * 0.28);
  var gridEndY = Math.floor(h * 0.88);

  var gridWidth = gridEndX - gridStartX;
  var gridHeight = gridEndY - gridStartY;

  var numCols = 4;
  var perCol = Math.ceil(totalQ / numCols);
  var colWidth = gridWidth / numCols;
  var rowHeight = gridHeight / perCol;

  var correctCount = 0;
  var wrongCount = 0;
  var blankCount = 0;
  var studentAnswers = {};

  var options = ['A', 'B', 'C', 'D'];

  for (var q = 1; q <= totalQ; q++) {
    var correctLetter = keyMap[q] || 'A';

    var cIdx = Math.floor((q - 1) / perCol);
    var rIdx = (q - 1) % perCol;

    var cellX = gridStartX + (cIdx * colWidth);
    var cellY = gridStartY + (rIdx * rowHeight);

    var bubbleAreaStartX = cellX + (colWidth * 0.35);
    var bubbleAreaWidth = colWidth * 0.62;
    var singleBubbleWidth = bubbleAreaWidth / 4;

    var optDarkness = {};

    options.forEach(function(opt, optIdx) {
      var bx = Math.floor(bubbleAreaStartX + (optIdx * singleBubbleWidth));
      var by = Math.floor(cellY + (rowHeight * 0.15));
      var bw = Math.floor(singleBubbleWidth * 0.75);
      var bh = Math.floor(rowHeight * 0.70);

      var darkPixelsInBubble = 0;
      var totalPixelsInBubble = 0;

      for (var py = by; py < by + bh && py < h; py += 2) {
        for (var px = bx; px < bx + bw && px < w; px += 2) {
          var pIndex = (py * w + px) * 4;
          var br = (pixels[pIndex] * 0.299 + pixels[pIndex + 1] * 0.587 + pixels[pIndex + 2] * 0.114);
          if (br < 110) {
            darkPixelsInBubble++;
          }
          totalPixelsInBubble++;
        }
      }

      var fillRatio = totalPixelsInBubble > 0 ? (darkPixelsInBubble / totalPixelsInBubble) : 0;
      optDarkness[opt] = fillRatio;
    });

    var maxFill = 0;
    var detectedOpt = null;
    var secondMaxFill = 0;

    options.forEach(function(opt) {
      var f = optDarkness[opt];
      if (f > maxFill) {
        secondMaxFill = maxFill;
        maxFill = f;
        detectedOpt = opt;
      } else if (f > secondMaxFill) {
        secondMaxFill = f;
      }
    });

    // ಕನಿಷ್ಠ 26% ಕಪ್ಪಾಗಿದ್ದರೆ ಮಾತ್ರ ಆ ವೃತ್ತ ತುಂಬಿದೆ ಎಂದು ಪರಿಗಣಿಸುವುದು
    var isActuallyShaded = (maxFill >= 0.26 && (maxFill - secondMaxFill >= 0.08));

    if (!isActuallyShaded) {
      blankCount++;
      studentAnswers[q] = 'BLANK';
    } else {
      studentAnswers[q] = detectedOpt;
      if (detectedOpt === correctLetter) {
        correctCount++;
      } else {
        wrongCount++;
      }
    }
  }

  // ಫಲಿತಾಂಶ ಲೆಕ್ಕಾಚಾರ
  var percentage = Math.round((correctCount / totalQ) * 100);
  var grade = 'C';
  if (percentage >= 85) grade = 'A+ (ಅತ್ಯುತ್ತಮ)';
  else if (percentage >= 70) grade = 'A (ಉತ್ತಮ)';
  else if (percentage >= 50) grade = 'B+ (ಸಾಧಾರಣ)';
  else if (percentage >= 35) grade = 'B (ತೇರ್ಗಡೆ)';
  else grade = 'C (ಕಲಿಕಾ ಕೊರತೆ)';

  document.getElementById('omr-res-score').innerText = correctCount;
  document.getElementById('omr-res-grade').innerText = `${percentage}% - ${grade}`;
  document.getElementById('omr-cnt-correct').innerText = correctCount;
  document.getElementById('omr-cnt-wrong').innerText = wrongCount;
  document.getElementById('omr-cnt-blank').innerText = blankCount;

  var badge = document.getElementById('omr-scan-badge');
  if (badge) {
    badge.className = 'text-[10px] bg-emerald-100 text-emerald-800 font-black px-2 py-0.5 rounded-full';
    badge.innerText = '✓ ನೈಜ OMR ಮೌಲ್ಯಮಾಪನ ಪೂರ್ಣಗೊಂಡಿದೆ';
  }

  playScannerAudioBeep(true);

  omrScannerState.currentResult = {
    totalQ: totalQ,
    score: correctCount,
    percentage: percentage,
    grade: grade,
    set: appState.currentExamSet || 'A',
    detectedAnswers: studentAnswers
  };

  var saveBtn = document.getElementById('btn-save-omr-record');
  if (saveBtn) saveBtn.disabled = false;

  showToast(`⚡ ನೈಜ OMR ಮೌಲ್ಯಮಾಪನ: ${correctCount} / ${totalQ} ಅಂಕಗಳು!`, 'success');
}

  var csvRows = [
    ["Sl No", "Roll / SATS", "Student Name", "Set", "Score", "Total Marks", "Percentage", "Grade"]
  ];

  list.forEach(function(r) {
    csvRows.push([r.sl, r.roll, r.name, r.set, r.score, r.total, r.percent, r.grade]);
  });

  var csvContent = "data:text/csv;charset=utf-8,\uFEFF" + csvRows.map(e => e.join(",")).join("\n");

  link.setAttribute("href", encodedUri);
  link.setAttribute("download", `OMR_Exam_Results_${Date.now()}.csv`);

  showToast("📥 Excel (CSV) ಫಲಿತಾಂಶಗಳ ಶೀಟ್ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ!", "success");

          var mainImg = (!has4OptionImages && (m.image || m.img)) ? (m.image || m.img) : null;

    // =========================================================================
// 🌟 100% ACCURATE 2-COLUMN MATCHING & PIPE TABLE AUTO-ALIGNER ENGINE
// =========================================================================

window.formatQuestionTextForDisplay = function(rawText, isTrueFalse = false) {
  if (!rawText) return '';
  let text = String(rawText).trim();

  // ೧. ಬೇಡದ ಟ್ಯಾಗ್‌ಗಳು ಮತ್ತು ಹೆಡರ್‌ಗಳ ಕ್ಲೀನಪ್
  text = text.replace(/\[cite:\s*\d+\]/gi, '').replace(/\[\d+\]/g, '').trim();
  text = text.replace(/^(?:ಪ್ರಶ್ನೆ\s*[\:\.\-]*\s*)+/gi, '').trim();
  text = text.replace(/^(?:ಮೊದಲೆರಡು\s*ಪದಗಳ\s*ಸಂಬಂಧದಂತೆ\s*ಮೂರನೇ\s*ಪದಕ್ಕೆ\s*ಸಂಬಂಧಿಸಿದ\s*ಪದ\s*ಬರೆಯಿರಿ\s*[\:\.\-]*\s*)/gi, '').trim();
  text = text.replace(/^(?:ಮೊದಲ\s*ಎರಡು\s*ಪದಗಳಿಗಿರುವ\s*ಸಂಬಂಧದಂತೆ\s*[\:\.\-]*\s*)/gi, '').trim();

  if (isTrueFalse) {
    text = text.replace(/^(?:ಸರಿ\s*ಅಥವಾ\s*ತಪ್ಪು\s*ಬರೆಯಿರಿ\s*[\:\.\-]*\s*)+/gi, '').trim();
    text = text.replace(/^(?:सही\s*या\s*गलत\s*लिखिए\s*[\:\.\-]*\s*)+/gi, '').trim();
  }

  text = text.replace(/<br\s*\/?>/gi, '\n').replace(/\\n/g, '\n');
  text = escapeHtml(text);
  if (typeof renderMathFormulaBeautifully === 'function') {
    text = renderMathFormulaBeautifully(text);
  }

  const rawLines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (rawLines.length <= 1) return text;

  const titleLine = rawLines[0];
  const bodyLines = rawLines.slice(1);

  // -----------------------------------------------------------------------
  // 🌟 ಕೇಸ್ ೧: ಮಾರ್ಕ್‌ಡೌನ್ ಕೋಷ್ಟಕ (Pipe `|` Table) ಪತ್ತೆಹಚ್ಚುವಿಕೆ (Image 3 - Q9 Fix)
  // -----------------------------------------------------------------------
  const pipeLines = bodyLines.filter(l => l.includes('|'));
  if (pipeLines.length >= 2 && pipeLines.length === bodyLines.length) {
    let tableRowsHtml = bodyLines.map((rowText, rIdx) => {
      const cells = rowText.split('|').map(c => c.trim()).filter(Boolean);
      const isHeader = (rIdx === 0);
      return `
        <tr style="${isHeader ? 'background-color: #f1f5f9; font-weight: 900; border-bottom: 1.5px solid #000;' : 'border-bottom: 1px solid #cbd5e1;'}">
          ${cells.map(cell => `
            <td style="border: 1px solid #000; padding: 3px 8px; text-align: center; font-size: 9.8pt; font-weight: ${isHeader ? '900' : '600'};">
              ${cell}
            </td>
          `).join('')}
        </tr>
      `;
    }).join('');

    return `
      <span class="font-semibold">${titleLine}</span>
      <div style="margin: 5px 0 5px 12px; width: 100%; overflow-x: auto;">
        <table style="border-collapse: collapse; border: 1.5px solid #000; min-width: 320px; max-width: 95%; background: #fff;">
          <tbody>${tableRowsHtml}</tbody>
        </table>
      </div>
    `;
  }

  // -----------------------------------------------------------------------
  // 🌟 ಕೇಸ್ ೨: ಒಂದೇ ಸಾಲಿನಲ್ಲಿ ಎರಡು ಕಾಲಂ ಬಂದಾಗ (Image 1 Fix - e.g., 'a. ಪಟ್ಟಿ 1  i. ಪಟ್ಟಿ 2')
  // -----------------------------------------------------------------------
  const splitLineRegex = /^([\(\[]?[a-zA-Z0-9೦-೯]+[\.\)\]\-]\s*[^|]+?)\s{2,}|(?=\s+[\(\[]?[iIvVxX0-9೦-೯a-zA-Z]+[\.\)\]\-])\s+(.+)$/;
  let combinedRowPairs = [];
  let trailingTextLines = [];
  let isCombinedPattern = true;

  for (let line of bodyLines) {
    const match = line.match(/^([\(\[]?[a-zA-Z0-9೦-೯]+[\.\)\]\-]\s*.+?)\s+([\(\[]?[iIvVxX0-9೦-೯a-zA-Z]+[\.\)\]\-]\s*.+)$/);
    if (match && trailingTextLines.length === 0) {
      combinedRowPairs.push({ col1: match[1].trim(), col2: match[2].trim() });
    } else {
      if (combinedRowPairs.length > 0) {
        trailingTextLines.push(line);
      } else {
        isCombinedPattern = false;
        break;
      }
    }
  }

  if (isCombinedPattern && combinedRowPairs.length >= 2) {
    return `
      <span class="font-semibold">${titleLine}</span>
      <div style="margin: 4px 0 4px 14px; width: 100%;">
        <table style="width: auto; min-width: 300px; max-width: 550px; border-collapse: collapse;">
          <tbody>
            ${combinedRowPairs.map(pair => `
              <tr>
                <td style="padding: 2.5px 18px 2.5px 0; font-size: 10pt; font-weight: 600; vertical-align: top; width: 50%;">${pair.col1}</td>
                <td style="padding: 2.5px 0; font-size: 10pt; font-weight: 600; vertical-align: top; width: 50%;">${pair.col2}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      ${trailingTextLines.length > 0 ? `
        <div style="margin-top: 3px; font-weight: 600; font-size: 10pt; padding-left: 4px;">
          ${trailingTextLines.join('<br/>')}
        </div>
      ` : ''}
    `;
  }

  // -----------------------------------------------------------------------
  // 🌟 ಕೇಸ್ ೩: ಎರಡು ಪ್ರತ್ಯೇಕ ಪಟ್ಟಿಗಳು ಒಂದರ ಕೆಳಗೆ ಒಂದು ಬಂದಾಗ (Image 2 & Image 3 - Q10 Fix)
  // (ಉದಾ: i, ii, iii, iv ಮತ್ತು a, b, c, d ಪ್ರತ್ಯೇಕವಾಗಿ ಬಂದರೆ ಅವುಗಳನ್ನು ಒಂದರ ಪಕ್ಕ ಒಂದು ಜೋಡಿಸುವುದು)
  // -----------------------------------------------------------------------
  const isRomanOrNum = (s) => /^[\(\[]?([iIvVxX]+|[0-9೦-೯]+)[\.\)\]\-]/.test(s);
  const isAlpha = (s) => /^[\(\[]?([a-dA-Dಅ-ಹ])[\.\)\]\-]/.test(s);

  let group1 = [];
  let group2 = [];
  let footerLines = [];
  let currentGroup = 1;

  for (let line of bodyLines) {
    if (currentGroup === 1) {
      if (isRomanOrNum(line) || (group1.length === 0 && isAlpha(line))) {
        group1.push(line);
      } else if (isAlpha(line) || isRomanOrNum(line)) {
        currentGroup = 2;
        group2.push(line);
      } else {
        footerLines.push(line);
      }
    } else if (currentGroup === 2) {
      if (isAlpha(line) || isRomanOrNum(line)) {
        group2.push(line);
      } else {
        currentGroup = 3;
        footerLines.push(line);
      }
    } else {
      footerLines.push(line);
    }
  }

  // ಎರಡೂ ಗ್ರೂಪ್‌ಗಳು ಸರಿಸುಮಾರು ಸಮಾನ ಸಂಖ್ಯೆಯಲ್ಲಿದ್ದರೆ 2-Column Side-by-Side ಕೋಷ್ಟಕ ನಿರ್ಮಾಣ
  if (group1.length >= 2 && group2.length >= 2 && Math.abs(group1.length - group2.length) <= 2) {
    const maxRows = Math.max(group1.length, group2.length);
    let rowsHtml = '';
    for (let i = 0; i < maxRows; i++) {
      const c1 = group1[i] || '';
      const c2 = group2[i] || '';
      rowsHtml += `
        <tr>
          <td style="padding: 2.5px 24px 2.5px 0; font-size: 10pt; font-weight: 600; vertical-align: top; width: 48%;">${c1}</td>
          <td style="padding: 2.5px 0; font-size: 10pt; font-weight: 600; vertical-align: top; width: 52%;">${c2}</td>
        </tr>
      `;
    }

    return `
      <span class="font-semibold">${titleLine}</span>
      <div style="margin: 4px 0 4px 14px; width: 100%;">
        <table style="width: auto; min-width: 320px; max-width: 580px; border-collapse: collapse;">
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
      ${footerLines.length > 0 ? `
        <div style="margin-top: 3px; font-weight: 600; font-size: 10pt; padding-left: 4px;">
          ${footerLines.join('<br/>')}
        </div>
      ` : ''}
    `;
  }

  // -----------------------------------------------------------------------
  // ೪. ಸಾಮಾನ್ಯ ಪಠ್ಯ ಲೈನ್‌ಗಳ ಡೀಫಾಲ್ಟ್ ಫಾರ್ಮ್ಯಾಟಿಂಗ್
  // -----------------------------------------------------------------------
  return rawLines.map((line, idx) => 
    idx === 0 
      ? `<span class="font-semibold">${line}</span>` 
      : `<br/><span style="display:inline-block; padding-left:14px; margin-top:2px; font-weight:600;">${line}</span>`
  ).join('');
};

(function installUniversalImageUnblocker() {

  // 24 ಪ್ರಶ್ನೆಗಳನ್ನು ಆಯ್ದುಕೊಳ್ಳುವುದು
  var selectedSet = allAvail.slice(0, targetCount).map(function(q) { return JSON.parse(JSON.stringify(q)); });

  // ಅಂಕಗಳ ವ್ಯತ್ಯಾಸ ಲೆಕ್ಕಾಚಾರ
  var currentTotal = selectedSet.reduce(function(s, q) { return s + getExactQuestionMarks(q); }, 0);
  var diff = targetMarks - currentTotal; // ಉದಾ: 40 - 44 = -4 (4 ಅಂಕ ಹೆಚ್ಚು)

  if (diff < 0) {
    // ಹೆಚ್ಚುವರಿ ಅಂಕಗಳಿದ್ದಾಗ ಕೆಲವು ಪ್ರಶ್ನೆಗಳನ್ನು 2M ಅಥವಾ 1M ಗೆ ಸರಿದೂಗಿಸುವುದು
    var toReduce = Math.abs(diff);
    for (var i = 0; i < selectedSet.length && toReduce > 0; i++) {
      var curM = getExactQuestionMarks(selectedSet[i]);
      if (curM === 3) {
        selectedSet[i].type = 'sa_2m';
        selectedSet[i].marks = 2;
        toReduce--;
      }
    }
    for (var j = 0; j < selectedSet.length && toReduce > 0; j++) {
      var curM2 = getExactQuestionMarks(selectedSet[j]);
      if (curM2 === 2) {
        selectedSet[j].type = 'vsa_1m';
        selectedSet[j].marks = 1;
        toReduce--;
      }
    }
  } else if (diff > 0) {
    // ಅಂಕಗಳ ಕೊರತೆಯಿದ್ದಾಗ
    var toAdd = diff;
    for (var i = 0; i < selectedSet.length && toAdd > 0; i++) {
      var curM = getExactQuestionMarks(selectedSet[i]);
      if (curM === 1) {
        selectedSet[i].type = 'sa_2m';
        selectedSet[i].marks = 2;
        toAdd--;
      }
    }
  }

  var finalBalancedMarks = selectedSet.reduce(function(s, q) { return s + getExactQuestionMarks(q); }, 0);
  if (selectedSet.length === targetCount && finalBalancedMarks === targetMarks) {
    return selectedSet;
  }

  return selectedSet.slice(0, targetCount);
};

// ೨. ಮಾಸ್ಟರ್ ಜನರೇಟರ್ ಗೇಟ್‌ವೇ (Never-Fail Generator)
window.generateExamPackageFromBank = function() {
  var isAdmin = sessionStorage.getItem('wy_is_admin') === 'true';
  var session = JSON.parse(localStorage.getItem('wy_active_session') || 'null');

  if (!isAdmin && (!session || !session.isLoggedIn)) {
    alert("🔒 ಪ್ರವೇಶ ನಿರ್ಬಂಧಿಸಲಾಗಿದೆ (Login Required)!\n\nದಯವಿಟ್ಟು ಮೊದಲು ಲಾಗಿನ್ ಮಾಡಿಕೊಳ್ಳಿ.");
    if (typeof openTeacherAuthModal === 'function') openTeacherAuthModal('login');
    return;
  }

  var selectedClass = document.getElementById('cfg-class')?.value || '6';
  var currentSubj = document.getElementById('cfg-subject')?.value || 'ಸಮಾಜ ವಿಜ್ಞಾನ';
  var schoolName = document.getElementById('cfg-school-name')?.value.trim() || 'ಸರ್ಕಾರಿ ಶಾಲೆ';
  var rawExamType = document.getElementById('cfg-exam-type')?.value || 'ಸಂಕಲನಾತ್ಮಕ ಮೌಲ್ಯಮಾಪನ-1 (SA-1) 2026-27';
  var targetTotalMarks = parseInt(document.getElementById('cfg-total-marks')?.value) || 40;
  var targetTotalQuestions = parseInt(document.getElementById('cfg-total-questions')?.value) || 24;
  var examDate = document.getElementById('cfg-exam-date')?.value || '2026-27';

  var checkedTypeNodes = document.querySelectorAll('input[name="qtype_opt"]:checked');
  var selectedTypes = Array.from(checkedTypeNodes).map(function(cb) { return cb.value; });
  if (selectedTypes.length === 0) {
    return alert('⚠️ ದಯವಿಟ್ಟು Step 3 ರಲ್ಲಿ ಕನಿಷ್ಠ ಒಂದು ಪ್ರಶ್ನೆ ಪ್ರಕಾರವನ್ನು ಆಯ್ಕೆಮಾಡಿ.');
  }

  var selectedBoxes = document.querySelectorAll('input[name="selected_chapter"]:checked');
  var selectedChapters = Array.from(selectedBoxes).map(function(b) { return b.value; });
  appState.activeSelectedChapters = selectedChapters;

  var allMatchingPool = (appState.activeSubjectQuestions || []).filter(function(q) {
    if (!q) return false;
    var isChapOk = (typeof isChapterMatchedFlexibly === 'function') 
      ? isChapterMatchedFlexibly(q.chapter, selectedChapters) 
      : (selectedChapters.length === 0 || selectedChapters.some(function(sc) { return safeCleanMatch(sc) === safeCleanMatch(q.chapter); }));
    var cType = getCanonicalQuestionType(q);
    return isChapOk && selectedTypes.includes(cType);
  });

  if (allMatchingPool.length === 0) {
    return alert('⚠️ ಆಯ್ಕೆಮಾಡಿದ ಪಾಠಗಳಲ್ಲಿ ಪ್ರಶ್ನೆಗಳು ಲಭ್ಯವಿಲ್ಲ. Step 2 ಮತ್ತು Step 3 ಪರಿಶೀಲಿಸಿ.');
  }

  // ಹಂತ ೧: ಬಳಕೆಯಾಗದ ಪ್ರಶ್ನೆಗಳಿಂದ ಟ್ರೈ ಮಾಡುವುದು
  var usedIds = (typeof getUsedQuestionIdsList === 'function') ? getUsedQuestionIdsList() : [];
  var freshUnusedPool = allMatchingPool.filter(function(q) {
    return !usedIds.includes(getQuestionUniqueKey(q));
  });

  var chosen = null;
  if (freshUnusedPool.length >= targetTotalQuestions) {
    chosen = solveStrictExactExamMath(freshUnusedPool, targetTotalMarks, targetTotalQuestions, selectedTypes);
  }

  // ಹಂತ ೨: ಪೂರ್ಣ ಪೂಲ್ ಹಾಗೂ ಆಟೋ-ಬ್ಯಾಲೆನ್ಸಿಂಗ್ ಮೂಲಕ ನಿಖರ 40 ಅಂಕ ಪಡೆಯುವುದು
  if (!chosen || chosen.length !== targetTotalQuestions) {
    if (usedIds.length > 0 && typeof resetQuestionRepeatCycle === 'function') {
      resetQuestionRepeatCycle(false);
    }
    chosen = solveStrictExactExamMath(allMatchingPool, targetTotalMarks, targetTotalQuestions, selectedTypes);
  }

  if (!chosen || chosen.length === 0) {
    return alert("⚠️ ಪ್ರಶ್ನೆಗಳ ಕೊರತೆಯಿದೆ. ದಯವಿಟ್ಟು ಹೆಚ್ಚಿನ ಪಾಠಗಳನ್ನು ಆಯ್ಕೆಮಾಡಿ.");
  }

  if (typeof recordQuestionsAsUsed === 'function') {
    recordQuestionsAsUsed(chosen);
  }

  appState.activeGeneratedQuestions = chosen;
  appState.currentExamSet = 'A';
  appState.baseGeneratedQuestions = JSON.parse(JSON.stringify(chosen));

  var actualMarks = chosen.reduce(function(a, b) { return a + getExactQuestionMarks(b); }, 0);
  var headerHtml = generateOfficialBoardHeader(schoolName, currentSubj, selectedClass, rawExamType, actualMarks, examDate);

  renderFullExamPaperWithCustomHeader(headerHtml);

  if (typeof injectSetSelectorBarUI === 'function') {
    injectSetSelectorBarUI();
  }

  if (typeof autoSaveGeneratedPaperToLocalStorage === 'function') {
    autoSaveGeneratedPaperToLocalStorage(chosen, headerHtml);
  }

  var outSec = document.getElementById('output-section');
  if (outSec) {
    outSec.classList.remove('hidden');
    switchOutputTab('paper');
    outSec.scrollIntoView({ behavior: 'smooth' });
  }

  showToast("⚡ ಯಶಸ್ವಿ: 6ನೇ ಸಮಾಜ ವಿಜ್ಞಾನ - ನಿಖರ " + chosen.length + " ಪ್ರಶ್ನೆಗಳು & " + actualMarks + " ಅಂಕಗಳ ಪತ್ರಿಕೆ ಸಿದ್ಧವಾಗಿದೆ!", "success");
};
</script>
