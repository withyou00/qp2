  <script>
    let appState = {
      activeSubjectQuestions: [],
      activeGeneratedQuestions: [],
      activeSelectedChapters: []
    };

    function safeString(val) { return (val !== null && val !== undefined) ? String(val).trim() : ''; }
    function safeCleanMatch(str) { return safeString(str).toLowerCase().replace(/[\(\)\s\-\.\:\d\/\,]/g, ''); }
    function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function getSerialSortNum(str) {
      if (!str) return 9999;
      const knMap = {'೦':'0','೧':'1','೨':'2','೩':'3','೪':'4','೫':'5','೬':'6','೭':'7','೮':'8','೯':'9'};
      const norm = String(str).replace(/[೦-೯]/g, d => knMap[d]);
      const m = norm.match(/(\d+)/);
      return m ? parseInt(m[1], 10) : 9999;
    }

    function getNormalizedSubjectKey(subjectStr) {
      if (!subjectStr) return 'general';
      const s = String(subjectStr).toLowerCase().trim();
      if (s.includes('ಪರಿಸರ') || s.includes('evs') || s.includes('environment')) return 'evs';
      if (s.includes('ಹಿಂದಿ') || s.includes('hindi')) return 'hindi';
      if (s.includes('ಸಮಾಜ') || s.includes('social')) return 'social_science';
      if (s.includes('ವಿಜ್ಞಾನ') || s.includes('science')) return 'science';
      if (s.includes('ಗಣಿತ') || s.includes('math')) return 'mathematics';
      if (s.includes('ಕನ್ನಡ') || s.includes('kannada')) return 'kannada';
      if (s.includes('ಇಂಗ್ಲಿಷ್') || s.includes('english')) return 'english';
      return safeCleanMatch(subjectStr);
    }

    function normalizeSubjectMatchText(str) {
      if (!str) return '';
      const s = String(str).toLowerCase().trim();
      if (s.includes('ವಿಜ್ಞಾನ') || s.includes('science')) return 'science';
      if (s.includes('ಗಣಿತ') || s.includes('math')) return 'mathematics';
      if (s.includes('ಕನ್ನಡ') || s.includes('kannada')) return 'kannada';
      if (s.includes('ಸಮಾಜ') || s.includes('social')) return 'social_science';
      if (s.includes('ಇಂಗ್ಲಿಷ್') || s.includes('english')) return 'english';
      if (s.includes('ಹಿಂದಿ') || s.includes('hindi')) return 'hindi';
      if (s.includes('ಪರಿಸರ') || s.includes('evs')) return 'evs';
      return s;
    }

    function cleanAuthPhone(str) {
      if (!str) return '';
      const digits = String(str).replace(/\D/g, '');
      return digits.length >= 10 ? digits.slice(-10) : digits;
    }

    function cleanAuthKey(str) {
      return String(str || '').trim().toLowerCase().replace(/\s+/g, '');
    }

    function isMatchQuestion(q) {
      if (!q) return false;
      const t = String(q.type || '').toLowerCase().trim();
      if (t === 'match' || t === 'matching' || t === 'match_the_following' || t.includes('ಹೊಂದಿಸಿ') || t.includes('ಜೋಡಿಸಿ')) return true;
      if (Array.isArray(q.matchPairs) && q.matchPairs.length > 0) return true;
      if (Array.isArray(q.pairs) && q.pairs.length > 0) return true;
      if (Array.isArray(q.colA) && Array.isArray(q.colB)) return true;
      const qText = String(q.q || '').toLowerCase();
      if (qText.includes('ಹೊಂದಿಸಿ ಬರೆಯಿರಿ') || qText.includes('match the following') || qText.includes('ಅ ಪಟ್ಟಿ') || qText.includes('ಅ ಗುಂಪು')) return true;
      return false;
    }

    function extractSmartMatchPairs(qItem) {
      if (!qItem) return [];
      if (Array.isArray(qItem.matchPairs) && qItem.matchPairs.length >= 2) return qItem.matchPairs.slice(0, 4);
      if (Array.isArray(qItem.pairs) && qItem.pairs.length >= 2) return qItem.pairs.slice(0, 4);
      if (Array.isArray(qItem.colA) && Array.isArray(qItem.colB) && qItem.colA.length >= 2) {
        const pairs = [];
        const len = Math.min(qItem.colA.length, qItem.colB.length, 4);
        for (let i = 0; i < len; i++) pairs.push({ a: String(qItem.colA[i]), b: String(qItem.colB[i]) });
        return pairs;
      }
      return [
        { a: 'ಅಂಶ 1', b: 'ಉತ್ತರ 1' },
        { a: 'ಅಂಶ 2', b: 'ಉತ್ತರ 2' },
        { a: 'ಅಂಶ 3', b: 'ಉತ್ತರ 3' },
        { a: 'ಅಂಶ 4', b: 'ಉತ್ತರ 4' }
      ];
    }

    function cleanItemNumbering(str) {
      if (!str) return '';
      return String(str).replace(/^[\dIVXabcde\(\)]+[\.\)\-\:\s]+/gi, '').trim();
    }

    function getExactQuestionMarks(q) {
      if (!q) return 1;
      if (isMatchQuestion(q)) return 4;
      const ct = getCanonicalQuestionType(q);
      if (ct === 'grammar_passage' || ct === 'passage') return parseInt(q.marks) || 4;
      if (ct === 'blanks') return 1;
      if (ct === 'la_5m' || ct === 'essay') return 5;
      if (ct === 'la_4m' || ct === 'match' || ct === 'poem_complete') return 4;
      if (ct === 'sa_3m' || ct === 'context' || ct === 'author_intro') return 3;
      if (ct === 'sa_2m' || ct === 'solve_math') return 2;
      return parseInt(q.marks) || 1;
    }

    function getCanonicalQuestionType(q) {
      if (!q) return 'vsa_1m';
      if (isMatchQuestion(q)) return 'match';
      
      const t = String(q.type || '').toLowerCase().trim();
      const qText = String(q.q || '').trim();
      const m = parseInt(q.marks) || 1;

      if (t === 'mcq' || t === 'multiple_choice' || (q.a && q.b)) return 'mcq';
      if (t === 'passage' || t === 'comprehension' || q.passage || qText.includes('ಗದ್ಯಭಾಗ')) return 'passage';
      if (t === 'context' || t.includes('ಸಂದರ್ಭ') || t.includes('ಹೇಳಿದರು') || (qText.startsWith('"') && qText.endsWith('"'))) return 'context';

      if ((t === 'blanks' || t === 'grammar_passage' || t.includes('ಖಾಲಿ')) && m >= 3) return 'grammar_passage';
      if (t === 'blanks' || t === 'fill_ups' || t === 'fib' || t.includes('ಖಾಲಿ')) return 'blanks';

      if (t === 'true_false' || t === 'tf' || t.includes('ಸರಿ') || t.includes('ತಪ್ಪು')) return 'true_false';
      if (t === 'analogy' || t.includes('ಸಂಬಂಧ')) return 'analogy';
      if (t === 'odd_one_out' || t.includes('ಗುಂಪಿಗೆ')) return 'odd_one_out';
      if (t === 'vsa_1m' || t === '1m') return 'vsa_1m';
      if (t === 'sa_2m' || t === '2m' || t === 'solve_math') return 'sa_2m';
      if (t === 'sa_3m' || t === '3m') return 'sa_3m';
      if (t === 'la_4m' || t === '4m' || t === 'diagram') return 'la_4m';
      if (t === 'la_5m' || t === '5m' || t === 'essay') return 'la_5m';

      if (m === 2) return 'sa_2m';
      if (m === 3) return 'sa_3m';
      if (m === 4) return 'la_4m';
      if (m >= 5) return 'la_5m';
      return 'vsa_1m';
    }

    function safeRepairAndParseJSON(rawText) {
      if (!rawText) return [];
      try {
        const direct = JSON.parse(rawText);
        if (Array.isArray(direct) && direct.length > 0) return direct;
      } catch (e1) {}

      let text = String(rawText).trim();
      text = text.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '').trim();
      text = text.replace(/[\u201C\u201D\u201E\u201F\u00AB\u00BB]/g, "'").replace(/[\u2018\u2019]/g, "'");
      text = text.replace(/,\s*([\]\}])/g, '$1');

      if (text.startsWith('[') && !text.endsWith(']')) text = text.replace(/,\s*$/, '') + '\n]';

      try {
        const repaired = JSON.parse(text);
        if (Array.isArray(repaired) && repaired.length > 0) return repaired;
      } catch (e2) {}

      const recoveredList = [];
      const objRegex = /\{[\s\S]*?\}(?=\s*,\s*\{|\s*\])/g;
      let match;
      while ((match = objRegex.exec(text)) !== null) {
        let chunk = match[0].trim().replace(/,\s*\}/g, '}');
        try {
          const obj = JSON.parse(chunk);
          if (obj && (obj.q || obj.chapter || obj.id)) recoveredList.push(obj);
        } catch(err) {}
      }
      return recoveredList;
    }

    // =========================================================================
    // 🎯 EXACT MARKS EXAM MATH SOLVER
    // =========================================================================
    window.solveStrictExactExamMath = function(pool, targetMarks, targetCount, selectedTypes) {
      if (!pool || pool.length === 0) return [];

      const shuffle = arr => {
        let a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };

      const b5 = shuffle(pool.filter(q => getExactQuestionMarks(q) === 5 && selectedTypes.includes(getCanonicalQuestionType(q))));
      const b4 = shuffle(pool.filter(q => getExactQuestionMarks(q) === 4 && selectedTypes.includes(getCanonicalQuestionType(q))));
      const b3 = shuffle(pool.filter(q => getExactQuestionMarks(q) === 3 && selectedTypes.includes(getCanonicalQuestionType(q))));
      const b2 = shuffle(pool.filter(q => getExactQuestionMarks(q) === 2 && selectedTypes.includes(getCanonicalQuestionType(q))));
      const b1 = shuffle(pool.filter(q => getExactQuestionMarks(q) === 1 && selectedTypes.includes(getCanonicalQuestionType(q))));

      b4.sort((a, b) => (isMatchQuestion(b) ? 1 : 0) - (isMatchQuestion(a) ? 1 : 0));

      const delta = targetMarks - targetCount;
      if (delta < 0) {
        alert("⚠️ ಅಂಕಗಳು ಪ್ರಶ್ನೆಗಳ ಸಂಖ್ಯೆಗಿಂತ ಹೆಚ್ಚಾಗಿರಬೇಕು.");
        return [];
      }

      let validSolutions = [];
      const max5 = Math.min(b5.length, Math.floor(delta / 4));
      for (let c5 = max5; c5 >= 0; c5--) {
        const rem5 = delta - (4 * c5);
        const max4 = Math.min(b4.length, Math.floor(rem5 / 3));

        for (let c4 = max4; c4 >= 0; c4--) {
          const rem4 = rem5 - (3 * c4);
          const max3 = Math.min(b3.length, Math.floor(rem4 / 2));

          for (let c3 = max3; c3 >= 0; c3--) {
            const c2 = rem4 - (2 * c3);
            if (c2 >= 0 && c2 <= b2.length) {
              const c1 = targetCount - (c2 + c3 + c4 + c5);
              if (c1 >= 0 && c1 <= b1.length) {
                let diversityScore = 0;
                if (c1 > 0) diversityScore += 100;
                if (c2 > 0) diversityScore += 100;
                if (c3 > 0) diversityScore += 100;
                if (c4 > 0) diversityScore += 100;
                if (c4 > 0 && b4.some(isMatchQuestion)) diversityScore += 150;
                validSolutions.push({ c1, c2, c3, c4, c5, score: diversityScore });
              }
            }
          }
        }
      }

      if (validSolutions.length > 0) {
        validSolutions.sort((a, b) => b.score - a.score);
        const best = validSolutions[0];

        const selected1MTypes = selectedTypes.filter(t => ['mcq', 'blanks', 'vsa_1m', 'true_false', 'analogy', 'odd_one_out'].includes(t));
        const sub1MBuckets = {};
        selected1MTypes.forEach(t => sub1MBuckets[t] = b1.filter(q => getCanonicalQuestionType(q) === t));

        let chosenC1 = [];
        let added = true;
        while (chosenC1.length < best.c1 && added) {
          added = false;
          for (const t of selected1MTypes) {
            if (chosenC1.length < best.c1 && sub1MBuckets[t] && sub1MBuckets[t].length > 0) {
              const item = sub1MBuckets[t].shift();
              if (!chosenC1.includes(item)) { chosenC1.push(item); added = true; }
            }
          }
        }
        if (chosenC1.length < best.c1) {
          const remB1 = b1.filter(q => !chosenC1.includes(q));
          chosenC1.push(...remB1.slice(0, best.c1 - chosenC1.length));
        }

        let chosenC4 = [];
        const matchItems = b4.filter(isMatchQuestion);
        const nonMatchB4 = b4.filter(q => !isMatchQuestion(q));

        if (matchItems.length > 0 && best.c4 > 0 && selectedTypes.includes('match')) {
          chosenC4.push(matchItems[0]);
        }
        const needMore4 = best.c4 - chosenC4.length;
        if (needMore4 > 0) chosenC4.push(...nonMatchB4.slice(0, needMore4));

        const finalResult = [
          ...b5.slice(0, best.c5),
          ...chosenC4,
          ...b3.slice(0, best.c3),
          ...b2.slice(0, best.c2),
          ...chosenC1
        ];

        const calcMarks = finalResult.reduce((sum, q) => sum + getExactQuestionMarks(q), 0);
        if (finalResult.length === targetCount && calcMarks === targetMarks) return finalResult;
      }

      alert(`⚠️ ಆಯ್ಕೆಮಾಡಿದ ಪಾಠಗಳಲ್ಲಿ ${targetMarks} ಅಂಕಗಳಿಗೆ ${targetCount} ಪ್ರಶ್ನೆಗಳ ಸಂಯೋಜನೆ ಸಾಧ್ಯವಾಗಿಲ್ಲ. ಹೆಚ್ಚಿನ ಪಾಠಗಳನ್ನು ಅಥವಾ ಪ್ರಕಾರಗಳನ್ನು ಆಯ್ಕೆಮಾಡಿ.`);
      return [];
    };

    // =========================================================================
    // 📄 RENDERING ENGINE (KANNADA, HINDI, ENGLISH TRI-LINGUAL)

    function renderMathFormulaBeautifully(str) {
      if (!str) return '';
      let text = String(str);
      const rawSubj = document.getElementById('cfg-subject')?.value || '';
      const isMath = rawSubj.includes('ಗಣಿತ') || rawSubj.toLowerCase().includes('math');

      text = text.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '<span class="inline-flex flex-col text-center align-middle mx-1 font-serif leading-none"><span class="border-b border-black pb-0.5">$1</span><span class="pt-0.5">$2</span></span>');
      text = text.replace(/(?:\\sqrt\{([^{}]+)\}|√\[([^\[\]]+)\]|√\(([^()]+)\)|√([0-9a-zA-Zθ]+))/g, '<span class="inline-flex items-center align-middle mx-1 font-serif">√<span class="border-t border-black px-1">$1$2$3$4</span></span>');

      if (isMath) {
        text = text.replace(/(?:\b|\()([0-9A-Zθ]+(?:\s*[\+\-]\s*[0-9A-Zθ]+)?)\s*\/\s*([0-9A-Zθ√]+(?:\s*[\+\-]\s*[0-9A-Zθ√]+)?)(?:\b|\))/g, (m, n, d) => {
          if (m.includes('http') || m.includes('<span')) return m;
          return `<span class="inline-flex flex-col text-center align-middle mx-1 font-serif leading-none"><span class="border-b border-black pb-0.5">${n.trim()}</span><span class="pt-0.5">${d.trim()}</span></span>`;
        });
      }

      text = text.replace(/\^2\b|\^2(?=[\s\)\=\+\-\*\/]|$)/g, '²').replace(/\^3\b|\^3(?=[\s\)\=\+\-\*\/]|$)/g, '³').replace(/(\d+)\s*(?:degree|deg)\b/gi, '$1°');
      return text;
    }

    function formatQuestionTextForDisplay(rawText, isTrueFalse = false) {
      if (!rawText) return '';
      let text = String(rawText).trim();
      text = text.replace(/\[cite:\s*\d+\]/gi, '').replace(/\[\d+\]/g, '').trim();
      text = text.replace(/^(?:ಪ್ರಶ್ನೆ\s*[\:\.\-]*\s*)+/gi, '').trim();

      if (isTrueFalse) {
        text = text.replace(/^(?:ಸರಿ\s*ಅಥವಾ\s*ತಪ್ಪು\s*ಬರೆಯಿರಿ\s*[\:\.\-]*\s*)+/gi, '').trim();
        text = text.replace(/^(?:सही\s*या\s*गलत\s*लिखिए\s*[\:\.\-]*\s*)+/gi, '').trim();
      }

      text = text.replace(/<br\s*\/?>/gi, '\n').replace(/\\n/g, '\n');
      text = escapeHtml(text);
      text = renderMathFormulaBeautifully(text);

      const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length > 1) {
        return lines.map((line, idx) => idx === 0 ? `<span class="font-semibold">${line}</span>` : `<br/><span style="display:inline-block; padding-left:14px; margin-top:2.5px; font-weight:600;">${line}</span>`).join('');
      }
      return text;
    }

    // =========================================================================

    window.renderCompleteOfficialDSERTBlueprint = function(questions, totalMarks, subject, grade) {
      const container = document.getElementById('rendered-blueprint');
      if (!container) return;

      const rawSubj = String(subject || '');
      const medium = document.getElementById('cfg-medium')?.value || 'kannada_medium';

      const isHindi = rawSubj.toLowerCase().includes('hindi') || rawSubj.includes('ಹಿಂದಿ');
      const totalQ = questions.length;

      const kCount = questions.filter(q => String(q.obj||'').includes('ಜ್ಞಾನ') || String(q.obj||'').includes('Knowledge')).length;
      const uCount = questions.filter(q => String(q.obj||'').includes('ಗ್ರಹಿಕೆ') || String(q.obj||'').includes('Understanding')).length;
      const aCount = questions.filter(q => String(q.obj||'').includes('ಅಭಿವ್ಯಕ್ತಿ') || String(q.obj||'').includes('Application')).length;
      const sCount = Math.max(0, totalQ - (kCount + uCount + aCount));

      const kMarks = Math.round(totalMarks * 0.25);
      const uMarks = Math.round(totalMarks * 0.45);
      const aMarks = Math.round(totalMarks * 0.20);
      const sMarks = totalMarks - (kMarks + uMarks + aMarks);

      const mcqCount = questions.filter(q => getCanonicalQuestionType(q) === 'mcq').length;
      const vsa1Count = questions.filter(q => getExactQuestionMarks(q) === 1 && getCanonicalQuestionType(q) !== 'mcq').length;
      const sa2Count = questions.filter(q => getExactQuestionMarks(q) === 2).length;
      const sa3Count = questions.filter(q => getExactQuestionMarks(q) === 3).length;
      const la4Count = questions.filter(q => getExactQuestionMarks(q) === 4).length;
      const la5Count = questions.filter(q => getExactQuestionMarks(q) === 5).length;

      const easyMarks = Math.round(totalMarks * 0.30);

      const chapterGroupMap = new Map();
      questions.forEach(q => {
        const ch = (q.chapter || 'ಸಾಮಾನ್ಯ ಘಟಕ').trim();
        if (!chapterGroupMap.has(ch)) {
          chapterGroupMap.set(ch, { count: 0, marks: 0, k_1m:0, k_2m:0, k_3m:0, u_1m:0, u_2m:0, u_3m:0, a_2m:0, a_3m:0, a_4m:0 });
        }
        const st = chapterGroupMap.get(ch);
        st.count += 1;
        const m = getExactQuestionMarks(q);
        st.marks += m;

        const obj = String(q.obj || '');
        if (obj.includes('ಜ್ಞಾನ') || obj.includes('Knowledge')) {
          if (m === 1) st.k_1m += 1; else if (m === 2) st.k_2m += 1; else st.k_3m += 1;
        } else if (obj.includes('ಅಭಿವ್ಯಕ್ತಿ') || obj.includes('Application')) {
          if (m === 2) st.a_2m += 1; else if (m === 3) st.a_3m += 1; else st.a_4m += 1;
        } else {
          if (m === 1) st.u_1m += 1; else if (m === 2) st.u_2m += 1; else st.u_3m += 1;
        }

              <tbody>

    // 🔒 STRICT EXAM GENERATOR GATEWAY (ONLY AUTHORIZED SUBJECTS & CLASSES)

    window.generateExamPackageFromBank = function() {
      const isAdmin = sessionStorage.getItem('wy_is_admin') === 'true';
      const session = JSON.parse(localStorage.getItem('wy_active_session') || 'null');

      if (!isAdmin && (!session || !session.isLoggedIn)) {
        alert(
          "🔒 ಪ್ರವೇಶ ನಿರ್ಬಂಧಿಸಲಾಗಿದೆ (Login Required)!\n\n" +
          "ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆ ರಚಿಸಲು ದಯವಿಟ್ಟು ಮೊದಲು ಶಿಕ್ಷಕರ ಲಾಗಿನ್ (₹100) ಅಥವಾ ಶಾಲಾ ಲಾಗಿನ್ (₹500) ಮಾಡಿಕೊಳ್ಳಿ.\n\n" +
          "ಲಾಗಿನ್ ಮಾಡಲು 'OK' ಒತ್ತಿರಿ."
        );
        openTeacherAuthModal('login');
        return;
      }

      if (!isAdmin && session && session.validityDate && new Date(session.validityDate) < new Date(new Date().toDateString())) {
        alert(`⚠️ ನಿಮ್ಮ ಖಾತೆಯ ಮಾನ್ಯತೆ ಮುಕ್ತಾಯಗೊಂಡಿದೆ (${session.validityDate}).\nನವೀಕರಣಕ್ಕಾಗಿ Admin ಸಂಪರ್ಕಿಸಿ: 9902090911.`);
        logoutAnyUser();
        return;
      }

      const selectedClass = document.getElementById('cfg-class')?.value || '8';
      const currentSubj = document.getElementById('cfg-subject')?.value || '';
      const normalizedCurrent = normalizeSubjectMatchText(currentSubj);

      // ಶಿಕ್ಷಕರ ತರಗತಿ ಹಾಗೂ ವಿಷಯ ಅನುಮತಿ ಪರಿಶೀಲನೆ
      if (!isAdmin && session && session.type === 'teacher') {
        const allowedClasses = (session.allowedClasses || []).map(c => String(c).replace(/\D/g, ''));
        const allowedSubjs = (session.allowedSubjects || []).map(normalizeSubjectMatchText);

        if (!allowedClasses.includes('all') && allowedClasses.length > 0 && !allowedClasses.includes(selectedClass)) {
          alert(`⚠️ ತರಗತಿ ನಿರ್ಬಂಧಿಸಲಾಗಿದೆ!\nನಿಮ್ಮ ಖಾತೆಗೆ ಈ ತರಗತಿಗೆ ಅನುಮತಿ ಇಲ್ಲ. Admin ಸಂಪರ್ಕಿಸಿ: 9902090911.`);
          return;
        }

        if (!allowedSubjs.includes('all') && allowedSubjs.length > 0 && !allowedSubjs.includes(normalizedCurrent)) {
          alert(`⚠️ ವಿಷಯ ನಿರ್ಬಂಧಿಸಲಾಗಿದೆ!\nನಿಮ್ಮ ಖಾತೆಗೆ ಈ ವಿಷಯಕ್ಕೆ ಅನುಮತಿ ಇಲ್ಲ. Admin ಸಂಪರ್ಕಿಸಿ: 9902090911.`);
          return;
        }
      }

      // ಪತ್ರಿಕೆ ರಚನೆ ಮುಂದುವರಿಕೆ
      const schoolName = document.getElementById('cfg-school-name')?.value.trim() || 'ಸರ್ಕಾರಿ ಶಾಲೆ';
      const rawExamType = document.getElementById('cfg-exam-type')?.value || 'ಸಂಕಲನಾತ್ಮಕ ಮೌಲ್ಯಮಾಪನ-1 (SA-1) 2026-27';
      const targetTotalMarks = parseInt(document.getElementById('cfg-total-marks')?.value) || 40;
      const targetTotalQuestions = parseInt(document.getElementById('cfg-total-questions')?.value) || 24;
      const examDate = document.getElementById('cfg-exam-date')?.value || '2026-27';

      const checkedTypeNodes = document.querySelectorAll('input[name="qtype_opt"]:checked');
      const selectedTypes = Array.from(checkedTypeNodes).map(cb => cb.value);
      if (selectedTypes.length === 0) return alert('⚠️ ದಯವಿಟ್ಟು Step 3 ರಲ್ಲಿ ಕನಿಷ್ಠ ಒಂದು ಪ್ರಶ್ನೆ ಪ್ರಕಾರವನ್ನು ಆಯ್ಕೆಮಾಡಿ.');

      const selectedBoxes = document.querySelectorAll('input[name="selected_chapter"]:checked');
      const selectedChapters = Array.from(selectedBoxes).map(b => b.value);
      appState.activeSelectedChapters = selectedChapters;

      const pool = (appState.activeSubjectQuestions || []).filter(q => {
        if (!q) return false;
        const isChapOk = (selectedChapters.length === 0 || selectedChapters.some(sc => safeCleanMatch(sc) === safeCleanMatch(q.chapter)));
        const cType = getCanonicalQuestionType(q);
        return isChapOk && selectedTypes.includes(cType);
      });

      if (pool.length === 0) return alert('⚠️ ಆಯ್ಕೆಮಾಡಿದ ಪಾಠಗಳಲ್ಲಿ ಪ್ರಶ್ನೆಗಳು ಲಭ್ಯವಿಲ್ಲ. Step 2 ಮತ್ತು Step 3 ಪರಿಶೀಲಿಸಿ.');

      let chosen = solveStrictExactExamMath(pool, targetTotalMarks, targetTotalQuestions, selectedTypes);
      if (!chosen || chosen.length === 0) return;

      appState.activeGeneratedQuestions = chosen;
      const actualMarks = chosen.reduce((a, b) => a + getExactQuestionMarks(b), 0);
      const headerHtml = generateOfficialBoardHeader(schoolName, currentSubj, selectedClass, rawExamType, actualMarks, examDate);

      renderFullExamPaperWithCustomHeader(headerHtml);

      const outSec = document.getElementById('output-section');
      if (outSec) {
        outSec.classList.remove('hidden');
        switchOutputTab('paper');
        outSec.scrollIntoView({ behavior: 'smooth' });
      }

      showToast(`⚡ ಯಶಸ್ವಿ: ${chosen.length} ಪ್ರಶ್ನೆಗಳು & ${actualMarks} ಅಂಕಗಳ ಪತ್ರಿಕೆ ಸಿದ್ಧವಾಗಿದೆ!`, 'success');
    };

    function forceInstantLoginDirect(userData, type) {

    window.handleTeacherLoginSubmit = async function() {
      const mobileInp = document.getElementById('t-login-mobile');
      const keyInp = document.getElementById('t-login-key');

      const mobile = mobileInp ? mobileInp.value.replace(/\D/g, '').trim() : '';

      showToast('⚡ ಲಾಗಿನ್ ಆಗುತ್ತಿದೆ...', 'info');

      const cleanPhone = mobile.slice(-10);
      const cleanKey = enteredKey.toLowerCase().replace(/\s+/g, '');

      let localUsers = [];
      try {
        const raw = localStorage.getItem('wy_admin_users_db');

      } catch (e) {}

      let matchedUser = localUsers.find(u => u && String(u.mobile || u.phone || '').replace(/\D/g, '').slice(-10) === cleanPhone);

      if (!matchedUser) {
        try {
          const controller = new AbortController();

          const res = await fetch(`https://new-version-qp-default-rtdb.asia-southeast1.firebasedatabase.app/users/${cleanPhone}.json?t=${Date.now()}`, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const cloudUser = await res.json();
            if (cloudUser) { matchedUser = cloudUser; localUsers.unshift(cloudUser); localStorage.setItem('wy_admin_users_db', JSON.stringify(localUsers)); }
          }
        } catch (e) {}
      }

      if (matchedUser) {

        return forceInstantLoginDirect(fallbackUser, 'teacher');

(function initAdminTripleClickTrigger() {
  if (!localStorage.getItem('wy_admin_pass')) {

  let clickCount = 0;
  let clickTimer = null;

  function attachTripleClick() {
    const logoEl = document.querySelector('header .cursor-pointer');
    if (logoEl) {
      logoEl.addEventListener('click', (e) => {
        clickCount++;
        clearTimeout(clickTimer);
        if (clickCount === 3) {

          e.preventDefault();
          e.stopPropagation();
          openAdminLoginModal();
        } else {
          clickTimer = setTimeout(() => { clickCount = 0; }, 700);
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachTripleClick);
  } else {

})();

// ೫. ಎಡಿಟ್ ಮಾಡಿದ ವಿವರಗಳನ್ನು Firebase ಮತ್ತು LocalStorage ಗೆ ಸೇವ್ ಮಾಡುವುದು
window.saveEditedUserSubmit = async function(index) {
  let users = [];
  try { users = JSON.parse(localStorage.getItem('wy_admin_users_db') || '[]'); } catch (e) {}
  const u = users[index];
  if (!u) return;

  const newName = document.getElementById('edit-u-name')?.value.trim();
  const newMobile = document.getElementById('edit-u-mobile')?.value.trim();
  const newSchool = document.getElementById('edit-u-school')?.value.trim();
  const newKey = document.getElementById('edit-u-key')?.value.trim();
  const newValidity = document.getElementById('edit-u-validity')?.value;

  const checkedClasses = Array.from(document.querySelectorAll('input[name="edit_u_classes"]:checked')).map(cb => cb.value);
  const checkedSubjs = Array.from(document.querySelectorAll('input[name="edit_u_subjects"]:checked')).map(cb => cb.value);

  if (!newName || !newMobile || !newKey) return alert('⚠️ ಹೆಸರು, ಮೊಬೈಲ್ ಮತ್ತು Secret Key ಕಡ್ಡಾಯವಾಗಿದೆ.');

  const oldPhone = String(u.mobile || u.dise || '').replace(/\D/g, '').slice(-10);

  u.name = newName;
  if (u.type === 'school') u.dise = newMobile;
  else u.mobile = newMobile;
  u.school = newSchool;
  u.secretKey = newKey;
  u.validityDate = newValidity;
  u.allowedClasses = checkedClasses.length > 0 ? checkedClasses : ['all'];
  u.classes = u.allowedClasses.join(', ');
  u.allowedSubjects = checkedSubjs.length > 0 ? checkedSubjs : ['all'];
  u.subjects = u.allowedSubjects.join(', ');

  users[index] = u;
  localStorage.setItem('wy_admin_users_db', JSON.stringify(users));

  // 🔥 ಲೈವ್ ಯೂಸರ್ ಸೆಷನ್ ತಕ್ಷಣ ಅಪ್ಡೇಟ್
  const session = JSON.parse(localStorage.getItem('wy_active_session') || 'null');
  if (session && String(session.mobile || session.dise || '').replace(/\D/g, '').slice(-10) === oldPhone) {
    session.name = u.name;
    session.school = u.school;
    session.mobile = u.mobile || u.dise;
    session.allowedClasses = u.allowedClasses;
    session.allowedSubjects = u.allowedSubjects;
    session.validityDate = u.validityDate;
    localStorage.setItem('wy_active_session', JSON.stringify(session));

    const schoolInp = document.getElementById('cfg-school-name');
    if (schoolInp) schoolInp.value = u.school;

    if (typeof applyUserSubjectPermissionsToUI === 'function') applyUserSubjectPermissionsToUI(session);
    if (typeof renderTopUserProfileBar === 'function') renderTopUserProfileBar();
  }

  // Firebase ಗೆ ಸೇವ್
  try {
    const targetKey = String(u.mobile || u.dise || '').replace(/\D/g, '').slice(-10);
    await fetch(`https://new-version-qp-default-rtdb.asia-southeast1.firebasedatabase.app/users/${targetKey}.json`, {
      method: 'PUT',
      body: JSON.stringify(u)
    });
  } catch (e) {}

  showToast('✅ ಬಳಕೆದಾರರ ವಿವರ ಹಾಗೂ ಶಾಲೆಯ ಹೆಸರು ಯಶಸ್ವಿಯಾಗಿ ಸೇವ್ ಆಗಿದೆ!', 'success');
  openAdminDashboardModal('users');
};

window.approveRequestDirectly = async function(reqId) {
  let requests = [];
  try { requests = JSON.parse(localStorage.getItem('wy_admin_requests') || '[]'); } catch (e) {}
  const req = requests.find(r => r && r.id === reqId);
  if (!req) return;

  const autoKey = 'WY-' + Math.floor(100000 + Math.random() * 900000);
  const assignedKey = prompt(`ಅನುಮೋದನೆಗಾಗಿ Secret Key:`, autoKey) || autoKey;

  const newUser = {
    ...req,
    secretKey: assignedKey.trim(),
    validityDate: '2030-12-31',
    allowedSubjects: req.subjects ? req.subjects.split(',').map(s => s.trim()) : ['all'],
    allowedClasses: req.classes ? req.classes.split(',').map(c => c.trim()) : ['all'],
    status: 'active'
  };

  const targetPhone = String(req.mobile || req.dise || '').replace(/\D/g, '').slice(-10);

  // Firebase ಗೆ ಬರೆಯುವುದು
  try {
    await fetch(`https://new-version-qp-default-rtdb.asia-southeast1.firebasedatabase.app/users/${targetPhone}.json`, {
      method: 'PUT', body: JSON.stringify(newUser)
    });
    await fetch(`https://new-version-qp-default-rtdb.asia-southeast1.firebasedatabase.app/requests/${reqId}.json`, {
      method: 'DELETE'
    });
  } catch (e) {}

  let users = [];
  try { users = JSON.parse(localStorage.getItem('wy_admin_users_db') || '[]'); } catch (e) {}
  users.unshift(newUser);
  localStorage.setItem('wy_admin_users_db', JSON.stringify(users));

  requests = requests.filter(r => r.id !== reqId);
  localStorage.setItem('wy_admin_requests', JSON.stringify(requests));

  const msg = `*🎉 ಅಭಿನಂದನೆಗಳು! With You QP Generator ಖಾತೆ ಸಕ್ರಿಯಗೊಂಡಿದೆ (Approved)*\n\n` +
              `👤 *ಹೆಸರು:* ${req.name}\n` +
              `🏫 *ಶಾಲೆ:* ${req.school}\n` +
              `🎒 *ತರಗತಿಗಳು:* ${req.classes || 'ಆಯ್ಕೆಮಾಡಿದ ತರಗತಿಗಳು'}\n` +
              `📚 *ವಿಷಯಗಳು:* ${req.subjects || 'ಆಯ್ಕೆಮಾಡಿದ ವಿಷಯಗಳು'}\n` +
              `🔑 *Secret Key:* ${assignedKey}\n\n` +
              `ಈ Secret Key ಬಳಸಿ ಲಾಗಿನ್ ಆಗಿ ನಿಮ್ಮ ಪ್ರಶ್ನೆ ಪತ್ರಿಕೆಗಳನ್ನು ರಚಿಸಿಕೊಳ್ಳಿ. ಧನ್ಯವಾದಗಳು!`;

  window.open(`https://wa.me/91${targetPhone}?text=${encodeURIComponent(msg)}`, '_blank');
  showToast('✅ ಯಶಸ್ವಿಯಾಗಿ Approve ಮಾಡಲಾಗಿದೆ!', 'success');
  openAdminDashboardModal('users');
};

window.openPopupQuestionEditor = function(qIndex) {
  const currentQ = (appState.activeGeneratedQuestions || [])[qIndex];
  if (!currentQ) return alert('⚠️ ಪ್ರಶ್ನೆಯ ವಿವರ ಲಭ್ಯವಿಲ್ಲ.');

  let wrapper = document.getElementById('auth-modal-wrapper');
  if (!wrapper) {
    wrapper = document.createElement('div');
    wrapper.id = 'auth-modal-wrapper';
    document.body.appendChild(wrapper);
  }

  wrapper.className = 'fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto';
  wrapper.style.display = 'flex';

  const qType = getCanonicalQuestionType(currentQ);
  const qMarks = getExactQuestionMarks(currentQ);
  const isMCQ = (qType === 'mcq') || (currentQ.a && currentQ.b);

  // 🌟 ಆಯ್ಕೆ ಮಾಡಿದ ಪಾಠಗಳ ಪಟ್ಟಿ
  const selectedBoxes = document.querySelectorAll('input[name="selected_chapter"]:checked');
  const selectedChapters = appState.activeSelectedChapters && appState.activeSelectedChapters.length > 0 
    ? appState.activeSelectedChapters 
    : Array.from(selectedBoxes).map(b => b.value);

  // 🌟 ಫಿಲ್ಟರ್: ಕೇವಲ ಆಯ್ಕೆ ಮಾಡಿದ ಪಾಠಗಳು + ಅದೇ ಪ್ರಶ್ನೆ ಪ್ರಕಾರ + ಅದೇ ಅಂಕಗಳು
  const activeBank = appState.activeSubjectQuestions || [];
  const alternativeQuestions = activeBank.filter(q => {
    if (!q || q === currentQ) return false;
    const sameType = getCanonicalQuestionType(q) === qType;
    const sameMarks = getExactQuestionMarks(q) === qMarks;
    const notAlreadyInPaper = !appState.activeGeneratedQuestions.includes(q);

    const isFromSelectedChapter = (selectedChapters.length === 0) || 
      selectedChapters.some(sc => safeCleanMatch(sc) === safeCleanMatch(q.chapter));

    return sameType && sameMarks && notAlreadyInPaper && isFromSelectedChapter;
  });

  const displayChaptersText = selectedChapters.length > 0 
    ? selectedChapters.map(c => c.length > 15 ? c.substring(0, 15) + '..' : c).join(', ') 
    : 'ಎಲ್ಲಾ ಪಾಠಗಳು';

  wrapper.innerHTML = `
    <div class="bg-white rounded-3xl p-6 space-y-4 max-w-2xl w-full shadow-2xl border border-slate-200 max-h-[92vh] overflow-y-auto" onclick="event.stopPropagation()">
      
      <!-- Header -->
      <div class="flex items-center justify-between border-b pb-3">
        <div class="flex items-center space-x-2.5">
          <div class="w-10 h-10 rounded-2xl bg-amber-500 text-slate-950 flex items-center justify-center font-black text-lg shadow">
            <i class="fa-solid fa-pen-to-square"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-base text-slate-900 leading-tight">ಪ್ರಶ್ನೆ ಬದಲಾವಣೆ & ಸಂಪಾದನೆ (Question Editor)</h3>
            <div class="flex items-center gap-1.5 text-[11px] font-bold text-slate-500 mt-0.5 flex-wrap">
              <span class="bg-indigo-50 text-indigo-800 border border-indigo-200 px-2 py-0.2 rounded-md">ಪ್ರಶ್ನೆ ಸಂಖ್ಯೆ: ${qIndex + 1}</span>
              <span class="bg-emerald-50 text-emerald-800 border border-emerald-200 px-2 py-0.2 rounded-md">${qMarks} ಅಂಕ</span>
              <span class="bg-amber-50 text-amber-900 border border-amber-200 px-2 py-0.2 rounded-md truncate max-w-[220px]" title="${escapeHtml(currentQ.chapter || '')}">ಘಟಕ: ${escapeHtml(currentQ.chapter || 'ಸಾಮಾನ್ಯ')}</span>
            </div>
          </div>
        </div>
        <button type="button" onclick="closeAuthModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-black cursor-pointer">✕</button>
      </div>

      <!-- Navigation Tabs -->
      <div class="flex bg-slate-100 p-1 rounded-2xl text-xs font-bold gap-1">
        <button id="qedit-tab-bank" onclick="switchQEditTab('bank')" class="flex-1 py-2 rounded-xl transition bg-slate-900 text-white shadow">
          <i class="fa-solid fa-database"></i> ೧. ಬ್ಯಾಂಕ್‌ನಿಂದ ಪರ್ಯಾಯ ಪ್ರಶ್ನೆ (${alternativeQuestions.length})
        </button>
        <button id="qedit-tab-manual" onclick="switchQEditTab('manual')" class="flex-1 py-2 rounded-xl transition text-slate-700 hover:bg-white">
          <i class="fa-solid fa-pen"></i> ೨. ಸ್ವಂತ ಪ್ರಶ್ನೆ/ಉತ್ತರ ಟೈಪ್ ಮಾಡಿ
        </button>
      </div>

      <!-- 🌟 TAB 1: SWAP FROM SELECTED CHAPTERS -->
      <div id="qedit-view-bank" class="space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2 bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-200 text-xs font-bold text-emerald-950">
          <span>📖 <b>ಆಯ್ಕೆಮಾಡಿದ ಪಾಠಗಳು:</b> ${escapeHtml(displayChaptersText)}</span>
          <input type="text" id="qedit-bank-search" oninput="filterQEditBankList(${qIndex})" placeholder="🔍 ಪ್ರಶ್ನೆ ಹುಡುಕಿ..." class="px-2.5 py-1 bg-white border border-emerald-300 rounded-lg text-xs font-bold w-40 outline-none" />
        </div>

        <div id="qedit-alternatives-container" class="space-y-2.5 max-h-[48vh] overflow-y-auto pr-1">
          ${renderAlternativeBankListHtml(alternativeQuestions, qIndex, isMCQ)}
        </div>
      </div>

      <!-- 🌟 TAB 2: MANUAL TEXT EDIT -->
      <div id="qedit-view-manual" class="hidden space-y-3 text-xs font-bold">
        <div>
          <label class="block text-slate-700 mb-1">ಪ್ರಶ್ನೆ ಪಠ್ಯ (Question Text)</label>
          <textarea id="manual-q-text" rows="3" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-slate-900 focus:bg-white focus:border-amber-500 outline-none leading-relaxed">${escapeHtml(currentQ.q || '')}</textarea>
        </div>

        ${isMCQ ? `
          <div class="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border">
            <div>
              <label class="block text-slate-600 mb-0.5">(A) ಆಯ್ಕೆ</label>
              <input type="text" id="manual-q-a" value="${escapeHtml(currentQ.a || '')}" class="w-full px-2.5 py-1.5 bg-white border rounded-lg font-bold" />
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5">(B) ಆಯ್ಕೆ</label>
              <input type="text" id="manual-q-b" value="${escapeHtml(currentQ.b || '')}" class="w-full px-2.5 py-1.5 bg-white border rounded-lg font-bold" />
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5">(C) ಆಯ್ಕೆ</label>
              <input type="text" id="manual-q-c" value="${escapeHtml(currentQ.c || '')}" class="w-full px-2.5 py-1.5 bg-white border rounded-lg font-bold" />
            </div>
            <div>
              <label class="block text-slate-600 mb-0.5">(D) ಆಯ್ಕೆ</label>
              <input type="text" id="manual-q-d" value="${escapeHtml(currentQ.d || '')}" class="w-full px-2.5 py-1.5 bg-white border rounded-lg font-bold" />
            </div>
          </div>
        ` : ''}

        <div>
          <label class="block text-slate-700 mb-1">ಕೀ ಉತ್ತರ (Key Answer)</label>
          <textarea id="manual-q-ans" rows="2" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-bold text-emerald-950 focus:bg-white focus:border-emerald-500 outline-none leading-relaxed">${escapeHtml(currentQ.ans || '')}</textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-700 mb-1">ಘಟಕದ ಹೆಸರು (Chapter)</label>
            <input type="text" id="manual-q-chap" value="${escapeHtml(currentQ.chapter || 'ಸಾಮಾನ್ಯ ಘಟಕ')}" class="w-full px-2.5 py-1.5 bg-slate-50 border rounded-lg font-bold" />
          </div>
          <div>
            <label class="block text-slate-700 mb-1">ಉದ್ದಿಷ್ಟ (Objective)</label>
            <select id="manual-q-obj" class="w-full px-2.5 py-1.5 bg-slate-50 border rounded-lg font-bold">
              <option value="ಜ್ಞಾನ" ${currentQ.obj==='ಜ್ಞಾನ'?'selected':''}>ಜ್ಞಾನ (Knowledge)</option>
              <option value="ಗ್ರಹಿಕೆ" ${(!currentQ.obj || currentQ.obj==='ಗ್ರಹಿಕೆ')?'selected':''}>ಗ್ರಹಿಕೆ (Understanding)</option>
              <option value="ಅನ್ವಯ" ${currentQ.obj==='ಅನ್ವಯ'?'selected':''}>ಅನ್ವಯ (Application)</option>
              <option value="ಕೌಶಲ" ${currentQ.obj==='ಕೌಶಲ'?'selected':''}>ಕೌಶಲ / ನಕ್ಷೆ (Skill)</option>
            </select>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-2 border-t">
          <button type="button" onclick="saveManualQuestionEditSubmit(${qIndex})" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs rounded-xl shadow cursor-pointer transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-floppy-disk"></i> <span>ಪ್ರಶ್ನೆ & ಕೀ ಉತ್ತರ ಅಪ್ಡೇಟ್ ಮಾಡಿ</span>
          </button>
          <button type="button" onclick="closeAuthModal()" class="px-4 py-3 bg-slate-200 text-slate-700 font-bold text-xs rounded-xl cursor-pointer">ರದ್ದು</button>
        </div>
      </div>

    </div>
  `;
};

// ೩. ಟ್ಯಾಬ್ ಸ್ವಿಚಿಂಗ್ ಫಂಕ್ಷನ್
window.switchQEditTab = function(tab) {
  const isBank = (tab === 'bank');
  document.getElementById('qedit-view-bank')?.classList.toggle('hidden', !isBank);
  document.getElementById('qedit-view-manual')?.classList.toggle('hidden', isBank);

  document.getElementById('qedit-tab-bank')?.classList.toggle('bg-slate-900', isBank);
  document.getElementById('qedit-tab-bank')?.classList.toggle('text-white', isBank);
  document.getElementById('qedit-tab-bank')?.classList.toggle('shadow', isBank);

  document.getElementById('qedit-tab-manual')?.classList.toggle('bg-slate-900', !isBank);
  document.getElementById('qedit-tab-manual')?.classList.toggle('text-white', !isBank);
  document.getElementById('qedit-tab-manual')?.classList.toggle('shadow', !isBank);
};

// ೪. ಪರ್ಯಾಯ ಪ್ರಶ್ನೆಗಳ ಪಟ್ಟಿ HTML ರೆಂಡರ್
function renderAlternativeBankListHtml(list, targetQIndex, isMCQ) {
  if (!list || list.length === 0) {
    return `<div class="p-8 text-center bg-slate-50 border rounded-2xl text-slate-500 font-bold text-xs">ಈ ಪ್ರಕಾರದ ಹಾಗೂ ಅಂಕದ ಯಾವುದೇ ಹೆಚ್ಚುವರಿ ಪ್ರಶ್ನೆಗಳು ಲಭ್ಯವಿಲ್ಲ. ಪಕ್ಕದ ಟ್ಯಾಬ್ನಲ್ಲಿ ನಿಮ್ಮದೇ ಸ್ವಂತ ಪ್ರಶ್ನೆ ಟೈಪ್ ಮಾಡಿಕೊಳ್ಳಿ.</div>`;
  }

  return list.map((altQ) => {
    const rawBankIndex = (appState.activeSubjectQuestions || []).indexOf(altQ);
    return `
      <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-2xl space-y-2 hover:border-amber-400 hover:bg-white transition shadow-sm">
        <div class="flex items-start justify-between gap-2">
          <div class="text-xs font-extrabold text-slate-900 leading-snug">
            ${formatQuestionTextForDisplay(altQ.q)}
          </div>
          <button type="button" onclick="swapQuestionWithBankItem(${targetQIndex}, ${rawBankIndex})" class="shrink-0 px-3 py-1.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:shadow text-slate-950 font-black text-xs rounded-xl shadow cursor-pointer transition flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> <span>ಆಯ್ಕೆಮಾಡಿ</span>
          </button>
        </div>

        ${isMCQ ? `
          <div class="grid grid-cols-2 gap-1 text-[11px] text-slate-600 font-semibold bg-white p-2 rounded-xl border border-slate-100">
            <div>(A) ${escapeHtml(altQ.a || '')}</div>
            <div>(B) ${escapeHtml(altQ.b || '')}</div>
            <div>(C) ${escapeHtml(altQ.c || '')}</div>
            <div>(D) ${escapeHtml(altQ.d || '')}</div>
          </div>
        ` : ''}

        <div class="flex items-center justify-between text-[11px] pt-1 text-slate-500 font-bold border-t border-slate-200/60">
          <span>📖 ಪಾಠ: <b>${escapeHtml(altQ.chapter || 'ಸಾಮಾನ್ಯ')}</b></span>
          <span class="text-emerald-700">ಉತ್ತರ: <b>${escapeHtml(altQ.ans || 'ಲಭ್ಯವಿದೆ')}</b></span>
        </div>
      </div>
    `;
  }).join('');
}

// ೫. ಬ್ಯಾಂಕ್‌ನಿಂದ ಪ್ರಶ್ನೆ ಬದಲಾಯಿಸುವ ಫಂಕ್ಷನ್ (SWAP)
window.swapQuestionWithBankItem = function(targetIdx, bankIdx) {
  const bankQ = (appState.activeSubjectQuestions || [])[bankIdx];
  if (!bankQ) return;

  appState.activeGeneratedQuestions[targetIdx] = JSON.parse(JSON.stringify(bankQ));
  refreshAllPaperViewsAndBlueprint();
  closeAuthModal();

  showToast(`✅ ಪ್ರಶ್ನೆ #${targetIdx + 1} ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಗಿದೆ!`, 'success');
};

// ೬. ಸ್ವಂತ ಟೈಪ್ ಮಾಡಿದ ಪ್ರಶ್ನೆ ಸೇವ್ ಮಾಡುವ ಫಂಕ್ಷನ್
window.saveManualQuestionEditSubmit = function(targetIdx) {
  const currentQ = (appState.activeGeneratedQuestions || [])[targetIdx];
  if (!currentQ) return;

  const newText = document.getElementById('manual-q-text')?.value.trim();
  const newAns = document.getElementById('manual-q-ans')?.value.trim();
  const newChap = document.getElementById('manual-q-chap')?.value.trim();
  const newObj = document.getElementById('manual-q-obj')?.value;

  if (!newText) return alert('⚠️ ಪ್ರಶ್ನೆಯ ಪಠ್ಯ ಖಾಲಿ ಇರುವಂತಿಲ್ಲ.');

  currentQ.q = newText;
  currentQ.ans = newAns || '';
  currentQ.chapter = newChap || currentQ.chapter || 'ಸಾಮಾನ್ಯ ಘಟಕ';
  currentQ.obj = newObj || currentQ.obj || 'ಗ್ರಹಿಕೆ';

  if (document.getElementById('manual-q-a')) {
    currentQ.a = document.getElementById('manual-q-a').value.trim();
    currentQ.b = document.getElementById('manual-q-b').value.trim();
    currentQ.c = document.getElementById('manual-q-c').value.trim();
    currentQ.d = document.getElementById('manual-q-d').value.trim();
  }

  appState.activeGeneratedQuestions[targetIdx] = currentQ;
  refreshAllPaperViewsAndBlueprint();
  closeAuthModal();

  showToast(`✅ ಪ್ರಶ್ನೆ #${targetIdx + 1} ಮತ್ತು ಕೀ ಉತ್ತರ ಯಶಸ್ವಿಯಾಗಿ ಅಪ್ಡೇಟ್ ಆಗಿದೆ!`, 'success');
};

// ೭. ಬ್ಯಾಂಕ್ ಪ್ರಶ್ನೆಗಳ ಲೈವ್ ಸರ್ಚ್ ಫಿಲ್ಟರ್
window.filterQEditBankList = function(targetQIndex) {
  const query = document.getElementById('qedit-bank-search')?.value.toLowerCase().trim() || '';
  const currentQ = (appState.activeGeneratedQuestions || [])[targetQIndex];
  if (!currentQ) return;

  const qType = getCanonicalQuestionType(currentQ);
  const qMarks = getExactQuestionMarks(currentQ);
  const isMCQ = (qType === 'mcq') || (currentQ.a && currentQ.b);

  const selectedBoxes = document.querySelectorAll('input[name="selected_chapter"]:checked');
  const selectedChapters = appState.activeSelectedChapters && appState.activeSelectedChapters.length > 0 
    ? appState.activeSelectedChapters 
    : Array.from(selectedBoxes).map(b => b.value);

  const activeBank = appState.activeSubjectQuestions || [];
  const filtered = activeBank.filter(q => {
    if (!q || q === currentQ) return false;
    const sameType = getCanonicalQuestionType(q) === qType;
    const sameMarks = getExactQuestionMarks(q) === qMarks;
    const notInPaper = !appState.activeGeneratedQuestions.includes(q);

    const isFromSelectedChapter = (selectedChapters.length === 0) || 
      selectedChapters.some(sc => safeCleanMatch(sc) === safeCleanMatch(q.chapter));

    const matchesSearch = (q.q && q.q.toLowerCase().includes(query)) || (q.chapter && q.chapter.toLowerCase().includes(query));

    return sameType && sameMarks && notInPaper && isFromSelectedChapter && matchesSearch;
  });

  const container = document.getElementById('qedit-alternatives-container');
  if (container) {
    container.innerHTML = renderAlternativeBankListHtml(filtered, targetQIndex, isMCQ);
  }
};

  </script>
</body>
</html>
